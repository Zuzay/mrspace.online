<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>Site editor | Mr. Space</title>
<link rel="stylesheet" href="../assets/home-fonts.css"><link rel="stylesheet" href="editor.css?v=20261008-editor">
<script src="../assets/ms-config.js"></script><script defer src="editor-copy.js?v=20261008-editor"></script><script defer src="editor.js?v=20261008-editor"></script>
</head>
<body>
<header class="toolbar"><div class="editor-brand"><a href="../panel/">MR. SPACE</a><span id="siteName"></span></div><div class="toolbar-actions"><select id="editorLang"></select><button id="areasToggle" class="ghost"></button><div id="mode" role="group"><button id="mEdit" aria-pressed="true"></button><button id="mBrowse" aria-pressed="false"></button></div><button class="btn" id="reviewBtn"></button></div></header>
<main class="workspace"><aside id="sidebar"><div class="sidebar-head"><p class="eyebrow" id="sidebarEyebrow"></p><h1 id="sidebarTitle"></h1><p id="sidebarHint"></p></div><div id="sideBody"></div><p id="draftStatus" role="status"></p></aside><div class="preview"><div id="contextBar" role="status"></div><iframe id="site" title="Your site" referrerpolicy="no-referrer"></iframe></div></main>
<div id="notice" role="status" aria-live="polite"></div>
<dialog id="confirm"><div class="dialog-head"><h2 id="confirmTitle"></h2><button class="ghost" data-close></button></div><div id="confirmBody"></div><div id="confirmActions"></div></dialog>
<dialog id="done"><h2 id="doneTitle"></h2><p id="doneText"></p><div id="doneList"></div><div class="actions"><button class="ghost" id="copyBtn"></button><button class="btn" id="reviseBtn"></button></div></dialog>
<div id="fatal" role="alert" hidden></div>
</body></html>
