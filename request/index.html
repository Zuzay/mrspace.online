<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Your site | Mr. Space</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23121418'/><circle cx='50' cy='50' r='17' fill='%23F6B93B'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --ink:#15171c; --muted:#5b616c; --line:rgba(21,23,28,.12);
  --fog:rgba(248,248,246,.58); --fog-strong:rgba(248,248,246,.78);
  --edit:#2d58d2; --done:#1c8456; --soft:rgba(21,23,28,.06);
  font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-color-scheme:dark){
  :root{--ink:#f1f1ee;--muted:#a2a7b0;--line:rgba(255,255,255,.14);--fog:rgba(26,28,33,.55);--fog-strong:rgba(26,28,33,.8);--edit:#86a3ff;--done:#4fc48d;--soft:rgba(255,255,255,.08)}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#dcdcd8;color:var(--ink);overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--edit);outline-offset:2px}

#site{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}

.fog{
  background:var(--fog);
  -webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);
  border:1px solid var(--line);
  box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 22px 60px -24px rgba(0,0,0,.45);
}

/* hover pill */
#pill{position:fixed;z-index:6;pointer-events:none;display:flex;align-items:center;gap:6px;
  padding:5px 11px 5px 9px;border-radius:999px;background:var(--edit);color:#fff;font-size:13px;font-weight:500;
  opacity:0;transform:translateY(4px);transition:opacity .14s,transform .14s}
#pill.on{opacity:1;transform:none}
#pill.edited{background:var(--done)}
#pill svg{width:14px;height:14px}

/* the fog editor */
#pop{position:fixed;z-index:10;width:min(400px,calc(100vw - 24px));border-radius:20px;padding:14px 14px 12px;display:none}
#pop.on{display:block;animation:rise .18s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
.pop-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.pop-head span{flex:1;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.x:hover{background:var(--soft)}
#pop textarea{width:100%;min-height:92px;max-height:46vh;resize:vertical;border:0;background:transparent;outline:none;
  font-size:18px;line-height:1.45;padding:4px 2px}
#pop textarea::placeholder{color:var(--muted)}
#pop .note{min-height:56px;font-size:15px;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.q{font-size:15px;font-weight:500;margin:2px 2px 4px}
.row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);flex:1;min-width:200px}
.chk input{width:16px;height:16px;accent-color:var(--edit)}
.link{font-size:14px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:6px 2px}
.btn{padding:10px 18px;border-radius:999px;background:var(--ink);color:var(--fog-strong);font-weight:600;font-size:15px}
@media (prefers-color-scheme:dark){.btn{color:#15171c}}
.btn:disabled{opacity:.45;cursor:default}
.ghost{padding:10px 14px;border-radius:999px;font-size:15px;color:var(--muted)}
.ghost:hover{background:var(--soft)}
.locked{font-size:15px;line-height:1.45;color:var(--muted);margin:4px 2px 2px}

/* dock */
#dock{position:fixed;z-index:8;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  display:flex;align-items:center;gap:6px;padding:6px;border-radius:999px;max-width:calc(100vw - 20px)}
#hint{font-size:14px;padding:0 10px 0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mode{display:flex;background:var(--soft);border-radius:999px;padding:3px}
#mode button{padding:7px 12px;border-radius:999px;font-size:14px;color:var(--muted)}
#mode button[aria-pressed="true"]{background:var(--fog-strong);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
#reviewBtn{white-space:nowrap}

/* review sheet */
#sheet{position:fixed;z-index:12;top:12px;right:12px;bottom:12px;width:min(420px,calc(100vw - 24px));border-radius:22px;
  display:none;flex-direction:column;overflow:hidden}
#sheet.on{display:flex;animation:rise .2s ease-out}
.sheet-head{display:flex;align-items:center;padding:16px 14px 8px 20px}
.sheet-head h2{flex:1;margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em}
.sheet-body{flex:1;overflow:auto;padding:4px 20px 12px}
.quota{font-size:13px;color:var(--muted);margin:0 0 12px}
.item{display:block;width:100%;text-align:left;padding:12px 0;border-bottom:1px solid var(--line)}
.item b{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:3px}
.item p{margin:0;font-size:15px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.item small{display:inline-block;margin-top:5px;font-size:12px;color:var(--muted)}
.item.lock small{color:var(--done)}
.empty{font-size:15px;color:var(--muted);padding:8px 0 16px}
.field{display:block;margin-top:16px}
.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.field input,.field textarea{width:100%;border:1px solid var(--line);background:var(--fog-strong);border-radius:12px;padding:11px 12px;font-size:16px;outline:none}
.field textarea{min-height:84px;resize:vertical;line-height:1.45}
.field input:focus,.field textarea:focus{border-color:var(--edit)}
.sheet-foot{padding:12px 20px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.sheet-foot .btn{width:100%;padding:13px}
#msg{font-size:14px;color:#b4472a;min-height:20px;margin:0 0 8px}

/* finish */
#done{position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:20px;background:rgba(0,0,0,.18)}
#done.on{display:grid}
.card{width:min(440px,100%);border-radius:24px;padding:28px 24px 22px}
.card h2{margin:0 0 8px;font-size:24px;font-weight:600;letter-spacing:-.015em}
.card p{margin:0 0 20px;font-size:16px;line-height:1.5;color:var(--muted)}
.card .row{gap:10px}
.card .btn{flex:1}

#fatal{position:fixed;inset:0;display:none;place-items:center;padding:24px;text-align:center;font-size:17px;color:#3a3d44}
#fatal.on{display:grid}

@media (max-width:640px){
  #pop{left:10px!important;right:10px;top:auto!important;width:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));border-radius:22px}
  #pop textarea{max-height:32vh}
  #sheet{top:auto;left:10px;right:10px;bottom:10px;width:auto;max-height:86vh}
  #hint{display:none}
  #dock{left:10px;right:10px;transform:none;justify-content:space-between}
}
@media (prefers-reduced-motion:reduce){#pop.on,#sheet.on{animation:none}#pill{transition:none}}
</style>
</head>

<div id="done"><div class="card fog">

  <div class="row"><button class="ghost" id="copyBtn"></button><button class="btn" id="reviseBtn"></button></div>
</div></div>

<div id="fatal"></div>

async function rpc(fn, args){
  const r = await fetch(SB+'/rest/v1/rpc/'+fn, {method:'POST', headers:{apikey:ANON, Authorization:'Bearer '+ANON, 'Content-Type':'application/json'}, body:JSON.stringify(args)});
  const txt = await r.text(); let d; try{ d = JSON.parse(txt) }catch(e){ d = txt }
  if(!r.ok) throw new Error((d && d.message) || 'failed');
  return d;
}

  updateDock();
}
function realItems(){ return [...S.items.values()].filter(i=>i.anchor!==GENERAL) }
function updateDock(){
  const n = realItems().length;
  $('#hint').textContent = n ? t.count(n) : t.hint;
  $('#reviewBtn').textContent = t.review + (n ? ' ('+n+')' : '');

/* ---------- site parts ---------- */
const CAND = '[data-ms-edit],h1,h2,h3,h4,h5,h6,p,li,blockquote,figcaption,button,a,label,td,th,dt,dd,small,img,picture,[style*="background-image"]';
function isImg(el){ return el.tagName==='IMG' || (el.style && el.style.backgroundImage && !el.innerText.trim()) }
function pick(node){
  if(!node || !node.closest) return null;
  let el = node.closest(CAND); if(!el || el.closest('[data-ms-skip]')) return null;
  if(el.tagName==='PICTURE') el = el.querySelector('img') || el;
  if(el.tagName==='A' && !el.innerText.trim()){ const i = el.querySelector('img'); if(i) el = i }
  if(!isImg(el) && !el.innerText.trim()) return null;
  return el;
}
function cssPath(el){
  const parts=[];
  while(el && el.nodeType===1 && el!==S.doc.body){
    if(el.id && !/\d{3,}/.test(el.id)){ parts.unshift('#'+CSS.escape(el.id)); break }
    let i=1, s=el; while((s=s.previousElementSibling)) if(s.tagName===el.tagName) i++;
    parts.unshift(el.tagName.toLowerCase()+':nth-of-type('+i+')'); el=el.parentElement;
  }
  return (parts[0] && parts[0][0]==='#' ? '' : 'body>') + parts.join('>');
}
const page = () => S.win.location.pathname;
const anchorOf = el => page()+'::'+cssPath(el);
function partName(el, original){
  const tag = el.tagName, short = (original||'').replace(/\s+/g,' ').slice(0,38);
  if(isImg(el)) return 'Image: '+(el.alt || (original||'').split('/').pop().split('?')[0] || 'photo').slice(0,48);
  const k = /^H\d$/.test(tag)?'Heading':(tag==='A'||tag==='BUTTON')?'Button':tag==='LI'?'List item':'Text';
  return (k+': '+short).slice(0,60);
}
function bgUrl(el){ const m=(el.style.backgroundImage||'').match(/url\(["']?(.*?)["']?\)/); return m?m[1]:'' }
const looksImg = v => /^https?:\/\/\S+\.(jpe?g|png|webp|gif|avif)(\?\S*)?$/i.test(v.trim());
function show(it, v){
  const el = it.el; if(!el) return;
  if(it.type==='image'){ if(looksImg(v||'')){ if(el.tagName==='IMG'){el.removeAttribute('srcset'); el.src=v.trim()} else el.style.backgroundImage='url("'+v.trim()+'")' } else restore(it) }
  else el.innerText = v;
}
function restore(it){
  if(!it.el) return;
  if(it.type==='image'){ if(it.el.tagName==='IMG'){ if(it.origSrcset) it.el.setAttribute('srcset',it.origSrcset); it.el.src=it.original } else it.el.style.backgroundImage=it.origBg }
  else if(it.origHTML!=null) it.el.innerHTML = it.origHTML;
}
function capture(it, el){
  it.el = el; it.type = isImg(el) ? 'image' : 'text';
  if(it.origHTML==null){ it.origHTML = el.innerHTML; it.origSrcset = el.getAttribute('srcset'); it.origBg = el.style.backgroundImage }
}

/* ---------- frame wiring ---------- */
function wire(){
  try{ S.win = frame.contentWindow; S.doc = frame.contentDocument; if(!S.doc || !S.doc.body) throw 0 }catch(e){ return noOverlay() }
  const st = S.doc.createElement('style');
  st.textContent = '.ms-hover{outline:2px dashed rgba(45,88,210,.95)!important;outline-offset:4px!important;cursor:text!important}'
   + '.ms-edited{outline:2px solid rgba(28,132,86,.85)!important;outline-offset:4px!important}'
   + '.ms-active{outline:2px solid rgba(45,88,210,1)!important;outline-offset:4px!important}'
   + '.ms-flash{animation:msf 1.8s ease 1}@keyframes msf{0%,100%{outline:2px dashed transparent;outline-offset:4px}35%,65%{outline:2px dashed rgba(45,88,210,.7);outline-offset:4px}}';
  S.doc.head.appendChild(st);

  S.doc.addEventListener('pointerover', e=>{
    if(!S.editing || e.pointerType!=='mouse') return;
    const el = pick(e.target); if(el===S.hovered) return;
    if(S.hovered) S.hovered.classList.remove('ms-hover');
    S.hovered = el; if(el && !(S.cur && S.cur.el===el)){ el.classList.add('ms-hover'); placePill(el) } else pill.classList.remove('on');
  });
  S.doc.documentElement.addEventListener('mouseleave', ()=>{ if(S.hovered) S.hovered.classList.remove('ms-hover'); S.hovered=null; pill.classList.remove('on') });
  S.doc.addEventListener('click', e=>{
    if(!S.editing) return;
    e.preventDefault(); e.stopPropagation();
    const el = pick(e.target); if(el) open(el);
  }, true);
  S.doc.addEventListener('submit', e=>{ if(S.editing) e.preventDefault() }, true);
  S.doc.addEventListener('keydown', e=>{ if(e.key==='Escape') cancel() });
  S.win.addEventListener('scroll', ()=>{ place(); if(S.hovered) placePill(S.hovered) }, {passive:true});
  S.win.addEventListener('resize', place);

  // bring back saved edits on this page
  for(const it of S.items.values()){
    if(it.anchor===GENERAL) continue;
    const [pg, sel] = it.anchor.split('::'); it.el = null;
    if(pg!==page()) continue;
    let el=null; try{ el = S.doc.querySelector(sel) }catch(e){}
    if(!el) continue;
    it.origHTML = null; capture(it, el); show(it, it.text); el.classList.add('ms-edited');
  }
  if(S.pendingOpen){ const it=S.items.get(S.pendingOpen); S.pendingOpen=null; if(it && it.el) setTimeout(()=>focusItem(it),60) }
  if(S.first){ S.first=false; flash() }
}
function flash(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const vh = S.win.innerHeight, els = [...S.doc.querySelectorAll(CAND)].filter(el=>{ const r=el.getBoundingClientRect(); return r.bottom>0 && r.top<vh && r.width>20 }).slice(0,40);
  els.forEach(el=>el.classList.add('ms-flash'));
  setTimeout(()=>els.forEach(el=>el.classList.remove('ms-flash')), 1900);
}
function placePill(el){
  const r = el.getBoundingClientRect(), it = S.items.get(anchorOf(el));
  pill.querySelector('span').textContent = it ? t.edited : t.editMe;
  pill.classList.toggle('edited', !!it);
  pill.style.left = Math.max(8, r.left)+'px';
  pill.style.top = Math.max(8, r.top-34)+'px';
  pill.classList.add('on');
}

/* ---------- the fog editor ---------- */
const mobile = () => matchMedia('(max-width:640px)').matches;
function open(el){
  if(S.cur) cancel();
  pill.classList.remove('on'); el.classList.remove('ms-hover');
  const a = anchorOf(el);
  let it = S.items.get(a);
  if(!it){
    it = {id:null, anchor:a, kind:'small', text:'', note:'', status:'new'};
    capture(it, el);
    it.original = it.type==='image' ? (el.getAttribute('src')||bgUrl(el)||'') : el.innerText.trim();
    it.target = partName(el, it.original);
  } else if(!it.el) capture(it, el);
  S.cur = it; el.classList.add('ms-active');
  render(it);
  pop.classList.add('on');
  if(mobile()){ el.scrollIntoView({block:'start', behavior:'smooth'}); setTimeout(()=>S.win.scrollBy(0,-70),300) }
  place();
  const ta = popBody.querySelector('textarea'); if(ta){ ta.focus({preventScroll:true}); ta.setSelectionRange(ta.value.length, ta.value.length) }
}
function render(it){
  $('#popLabel').textContent = it.target;
  const locked = it.status!=='new';
  if(locked){
    popBody.innerHTML = '<p class="locked"></p><div class="row" style="justify-content:flex-end"><button class="btn" data-a="close"></button></div>';
    popBody.querySelector('.locked').textContent = t.locked;
    popBody.querySelector('[data-a=close]').textContent = 'OK';
    popBody.querySelector('[data-a=close]').onclick = cancel;
    return;
  }
  const img = it.type==='image', saved = S.items.has(it.anchor);
  popBody.innerHTML =
    (img ? '<p class="q"></p>' : '') +
    '<textarea id="ta" rows="3"></textarea>' +
    '<textarea class="note" id="noteTa" rows="2" hidden></textarea>' +
    '<div class="row"><label class="chk"><input type="checkbox" id="bigChk"><span></span></label></div>' +
    '<div class="row"><button class="link" id="noteBtn"></button><span style="flex:1"></span>' +
    (saved ? '<button class="ghost" id="undoBtn"></button>' : '') + '<button class="btn" id="saveBtn"></button></div>';
  if(img){ popBody.querySelector('.q').textContent = t.imgQ }
  const ta = $('#ta'), note = $('#noteTa');
  ta.value = img ? it.text : (it.text || it.original);
  if(img) ta.placeholder = t.imgPh;
  note.placeholder = t.notePh; note.value = it.note || '';
  if(it.note){ note.hidden=false }
  $('#noteBtn').textContent = t.addNote; $('#noteBtn').hidden = !!it.note;
  $('#noteBtn').onclick = ()=>{ note.hidden=false; $('#noteBtn').hidden=true; note.focus() };
  $('#bigChk').checked = it.kind==='big'; popBody.querySelector('.chk span').textContent = t.big;
  $('#saveBtn').textContent = t.save; $('#saveBtn').onclick = ()=>commit(it);
  if(saved){ $('#undoBtn').textContent = t.undo; $('#undoBtn').onclick = ()=>undo(it) }
  ta.addEventListener('input', ()=>{ show(it, ta.value); place() });
  ta.addEventListener('keydown', e=>{ if(e.key==='Enter' && (e.metaKey||e.ctrlKey)) commit(it) });
}
function place(){
  if(!S.cur || !S.cur.el || mobile()) return;
  const r = S.cur.el.getBoundingClientRect(), ph = pop.offsetHeight, pw = pop.offsetWidth, room = innerHeight-90;
  let y = r.bottom+14; if(y+ph > room) y = r.top-ph-14; y = Math.min(Math.max(12, y), room-ph);
  const x = Math.min(Math.max(12, r.left), innerWidth-pw-12);
  pop.style.left = x+'px'; pop.style.top = y+'px';
}
function closePop(){ if(S.cur && S.cur.el) S.cur.el.classList.remove('ms-active'); S.cur=null; pop.classList.remove('on') }
function cancel(){
  const it = S.cur; if(!it) return;
  if(it.status==='new'){ if(S.items.has(it.anchor)) show(it, it.text); else restore(it) }
  closePop();
}
function commit(it){
  const v = $('#ta').value.trim(), note = $('#noteTa').value.trim(), big = $('#bigChk').checked;
  const unchanged = it.type==='image' ? !v : v===it.original;
  if(unchanged && !note){ return undo(it) }
  it.text = unchanged ? (it.type==='image' ? '' : it.original) : v; it.note = note; it.kind = big ? 'big' : 'small';
  S.items.set(it.anchor, it); it.el.classList.add('ms-edited'); show(it, it.text);
  closePop(); updateDock(); if($('#sheet').classList.contains('on')) renderList();
}
function undo(it){
  restore(it); if(it.el) it.el.classList.remove('ms-edited');
  S.items.delete(it.anchor); it.text=''; it.note='';
  closePop(); updateDock(); if($('#sheet').classList.contains('on')) renderList();
}
$('#popClose').onclick = cancel;
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ if(S.cur) cancel(); else closeSheet() } });

/* ---------- mode ---------- */
function setMode(edit){
  S.editing = edit;
  $('#mEdit').setAttribute('aria-pressed', edit); $('#mBrowse').setAttribute('aria-pressed', !edit);
  if(!edit){ cancel(); pill.classList.remove('on'); if(S.hovered) S.hovered.classList.remove('ms-hover') }
}
$('#mEdit').onclick = ()=>setMode(true);
$('#mBrowse').onclick = ()=>setMode(false);

/* ---------- review sheet ---------- */
function renderList(){
  const list = $('#list'); list.innerHTML = '';
  const its = realItems();
  if(!its.length){ list.innerHTML = '<p class="empty"></p>'; list.firstChild.textContent = t.empty; return }
  for(const it of its){
    const b = document.createElement('button'); b.className = 'item'+(it.status!=='new'?' lock':'');
    b.innerHTML = '<b></b><p></p><small></small>';
    b.querySelector('b').textContent = it.target;
    b.querySelector('p').textContent = (it.text || '') + (it.note ? '  ('+it.note+')' : '');
    const onPage = S.win && it.anchor.split('::')[0]===page();
    b.querySelector('small').textContent = it.status!=='new' ? t.inProgress : (onPage ? '' : t.elsewhere);
    b.onclick = ()=>{ closeSheet(); setMode(true);
      if(onPage && it.el) focusItem(it);
      else if(S.win){ S.pendingOpen = it.anchor; S.win.location.href = it.anchor.split('::')[0] } };
    list.appendChild(b);
  }
}
function focusItem(it){ it.el.scrollIntoView({block:'center'}); setTimeout(()=>open(it.el), 120) }
function openSheet(){ cancel(); renderList(); $('#msg').textContent=''; $('#sheet').classList.add('on') }
function closeSheet(){ $('#sheet').classList.remove('on') }
$('#reviewBtn').onclick = openSheet; $('#sheetClose').onclick = closeSheet;

function compose(it){ return (it.text||'') + (it.note ? NOTE+it.note : '') }
function payload(){
  const out = [];
  for(const it of S.items.values()){
    if(it.anchor===GENERAL) continue;
    out.push({id:it.id, kind:it.kind, target:it.target, anchor:it.anchor, original:it.original, request:compose(it).trim() || '(see note)'});
  }
  const other = $('#fOther').value.trim(), g = S.items.get(GENERAL);
  if(other) out.push({id:g?g.id:null, kind:'small', target:t.general, anchor:null, original:null, request:other});
  return out;
}
$('#sendBtn').onclick = async ()=>{
  const items = payload(), msg = $('#msg'), email = $('#fEmail').value.trim();
  if(!items.length && !S.sub){ msg.textContent = t.needOne; return }
  if(!/^\S+@\S+\.\S+$/.test(email)){ msg.textContent = t.needEmail; $('#fEmail').focus(); return }
  const btn = $('#sendBtn'); btn.disabled = true; msg.textContent = '';
  try{
    if(S.sub){
      const r = await rpc('ms_revise', {p_edit:EDIT, p_items:items, p_name:$('#fName').value, p_email:email});
      finish(EDIT, r.changed ? t.updated : t.noChange, r.changed ? t.savedV(r.version) : t.mailed);
    } else {
      const r = await rpc('ms_submit', {p_key:KEY, p_items:items, p_name:$('#fName').value, p_email:email});
      try{ localStorage.setItem('ms-edit-'+KEY, r.edit_key) }catch(e){}
      finish(r.edit_key, t.sent, t.mailed);
    }
  }catch(e){ msg.textContent = t.err }
  btn.disabled = false;
};

/* ---------- finish ---------- */
function finish(editKey, title, text){
  closeSheet();
  const link = location.origin + location.pathname + '?e=' + editKey;
  $('#doneTitle').textContent = title; $('#doneText').textContent = text;
  $('#reviseBtn').onclick = ()=>{ location.href = link };
  $('#copyBtn').onclick = async ()=>{ try{ await navigator.clipboard.writeText(link); $('#copyBtn').textContent = t.copied }catch(e){ prompt('', link) } };
  $('#done').classList.add('on');
}

/* ---------- fallbacks ---------- */
function fatal(text){ frame.remove(); $('#dock').remove(); const f=$('#fatal'); f.textContent=text; f.classList.add('on') }
function noOverlay(){ // site lives on another domain: plain note form
  $('#dock').style.display='none'; openSheet(); $('#sheetClose').style.display='none';
}

/* ---------- start ---------- */
function fromServer(c){
  let text = c.request || '', note = '';
  const i = text.lastIndexOf(NOTE); if(i>-1){ note = text.slice(i+NOTE.length); text = text.slice(0,i) }
  if(!c.anchor){ S.items.set(GENERAL, {id:c.id, anchor:GENERAL, status:c.status}); $('#fOther').value = c.request; return }
  S.items.set(c.anchor, {id:c.id, anchor:c.anchor, kind:c.kind, target:c.target, original:c.original||'', text, note, status:c.status, type:'text'});
}
(async function init(){
  paint();
  let url;
  try{
    if(EDIT){
      const d = await rpc('ms_get_submission', {p_edit:EDIT}); if(!d) throw 0;
      S.sub = d; url = d.url; S.quota = d.quota;
      (d.items||[]).forEach(fromServer);
      $('#fName').value = d.name || ''; $('#fEmail').value = d.email || '';
    } else if(KEY){
      const d = await rpc('ms_client_view', {p_key:KEY}); if(!d) throw 0;
      url = d.url; S.quota = d.quota;
    } else throw 0;
  }catch(e){ return fatal(t.bad) }
  paint();
  if(S.quota) $('#quota').textContent = t.quota(S.quota);
  if(!url) return noOverlay();
  const u = new URL(url, location.href);
  if(u.origin !== location.origin) return noOverlay();
  frame.addEventListener('load', ()=>{ closePop(); wire() });
  frame.src = u.href;
})();
</script>
