<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Preview · Mr. Space</title>
<style>
html,body{margin:0;height:100%;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4f5f7;color:#1c2430}
@media (prefers-color-scheme:dark){html,body{background:#141922;color:#e8ecf1}}
.m{min-height:100%;display:grid;place-items:center;padding:24px;text-align:center}
.m a{color:inherit}
</style>
</head>
<body>
<div class="m" id="msg"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/assets/ms-config.js"></script>
<script src="/assets/ms-render.js"></script>
<script>
(async () => {
  const tr = (navigator.language || "").toLowerCase().startsWith("tr");
  const t = (en, trk) => tr ? trk : en;
  const C = window.MS_CONFIG;
  const sb = supabase.createClient(C.url, C.anon, { auth: { persistSession: false, autoRefreshToken: false } });
  const key = new URLSearchParams(location.search).get("p") || "";
  const msg = document.getElementById("msg");
  if (!/^[0-9a-f-]{36}$/i.test(key)) { msg.innerHTML = `<p>${t("This preview link is not valid.", "Bu önizleme linki geçersiz.")}</p>`; return; }
  const { data } = await sb.rpc("ms_trial_preview", { p_key: key });
  if (!data) {
    msg.innerHTML = `<p>${t("This preview has expired. Write to us and we will send a new one.", "Bu önizlemenin süresi doldu. Bize yazın, yenisini gönderelim.")}<br><br><a href="mailto:hello@mrspace.online">hello@mrspace.online</a></p>`;
    return;
  }
  const until = data.until ? new Date(data.until).toLocaleDateString(tr ? "tr-TR" : "en-US") : "";
  const wm = t("Preview · mrspace.online", "Önizleme · mrspace.online") + (until ? " · " + t("until ", "son gün ") + until : "");
  const subject = encodeURIComponent(t("I want this site: ", "Bu siteyi istiyorum: ") + (data.business || ""));
  const cta = `<div style="position:fixed;left:0;right:0;bottom:0;z-index:70;background:#111418;color:#fff;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));font:15px/1.3 system-ui,-apple-system,sans-serif">
    <span>${t("Like it? We can put it live for you.", "Beğendiniz mi? Sizin için yayına alalım.")}</span>
    <a href="mailto:hello@mrspace.online?subject=${subject}" style="background:#fff;color:#111418;text-decoration:none;padding:9px 16px;border-radius:8px;font-weight:600">${t("I want this site", "Bu siteyi istiyorum")}</a></div><div style="height:72px"></div>`;
  const html = window.MsRender.render(data.content, data.theme, { noindex: true, watermark: wm }).replace("</body>", cta + "</body>");
  document.open(); document.write(html); document.close();
})();
</script>
</body>
</html>
