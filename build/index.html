<style>
:root{
  --bg:#eef0f2; --paper:#fff; --ink:#1c2430; --mute:#5d6878; --line:#d5dae1; --denim:#2f4a6b; --soft:#dfe6ef; --thread:#b5502e; --ok:#2e6b4a;
  --sans:"Familjen Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root{--bg:#141922;--paper:#1d2430;--ink:#e8ecf1;--mute:#9aa5b4;--line:#2e3746;--denim:#8fb0d6;--soft:#26344a;--thread:#e08a68;--ok:#7fc39c}}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--denim);outline-offset:2px}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));margin-top:calc(-1 * env(safe-area-inset-top,0px))}
.bar h1{font-size:1.05rem;margin:0;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.saved{color:var(--mute);font-size:.85rem;white-space:nowrap}
.saved.err{color:var(--thread)}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 12px;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--denim)}
.btn.main{background:var(--denim);border-color:var(--denim);color:var(--paper)}
.btn.small{padding:3px 8px;font-size:.85rem}
.btn.danger{color:var(--thread)}
.btn:disabled{opacity:.5;cursor:default}
.layout{display:grid;grid-template-columns:minmax(320px,440px) 1fr;height:calc(100% - 52px)}
.editor{overflow-y:auto;padding:14px;border-right:1px solid var(--line)}
.preview{position:relative;background:var(--line)}
.preview iframe{width:100%;height:100%;border:0;background:#fff}
.switch{display:none}
@media (max-width:860px){
  .layout{grid-template-columns:1fr;height:auto}
  .layout[data-view="edit"] .preview{display:none}
  .layout[data-view="preview"] .editor{display:none}
  .preview{height:calc(100vh - 110px)}
  .switch{display:flex;gap:4px;padding:8px 14px 0}
  .switch button[aria-pressed="true"]{background:var(--denim);color:var(--paper);border-color:var(--denim)}
}
details.panel{background:var(--paper);border:1px solid var(--line);border-radius:8px;margin-bottom:12px}
details.panel>summary{cursor:pointer;padding:12px 14px;font-weight:700;list-style:none}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary::after{content:"+";float:right;color:var(--mute)}
details.panel[open]>summary::after{content:"–"}
.pbody{padding:0 14px 14px;display:grid;gap:12px}
label.f{display:grid;gap:4px;font-size:.88rem;color:var(--mute)}
label.f input,label.f textarea,label.f select{color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%}
label.f textarea{min-height:90px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.presets{display:flex;flex-wrap:wrap;gap:8px}
.preset{border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--paper);cursor:pointer;display:grid;gap:4px;font-size:.82rem;min-width:74px}
.preset[aria-pressed="true"]{border-color:var(--denim);box-shadow:0 0 0 1px var(--denim)}
.preset .sw{display:flex;height:22px;border-radius:4px;overflow:hidden}
.preset .sw i{flex:1}
.colors{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.colors label{display:grid;gap:4px;font-size:.8rem;color:var(--mute)}
.colors input{width:100%;height:36px;border:1px solid var(--line);border-radius:6px;padding:2px;background:var(--paper)}
.hours{display:grid;gap:6px}
.hours .h{display:grid;grid-template-columns:90px 1fr 1fr auto;gap:6px;align-items:center;font-size:.85rem}
.hours input[type=time]{border:1px solid var(--line);border-radius:6px;padding:5px;background:var(--bg);width:100%}
.sec{border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:10px;background:var(--bg)}
.sec .sh{display:flex;align-items:center;gap:6px}
.sec .sh b{flex:1}
.img{display:flex;gap:10px;align-items:center}
.img img{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:var(--paper)}
.img .ph{width:64px;height:64px;border-radius:6px;border:1px dashed var(--line);display:grid;place-items:center;color:var(--mute);font-size:.75rem}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.grp{border-left:3px solid var(--soft);padding-left:10px;display:grid;gap:8px}
.it{display:grid;grid-template-columns:1fr 90px auto;gap:6px}
.it input{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--paper);width:100%}
.it .d{grid-column:1/3}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.gal .g{display:grid;gap:4px}
.gal img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:6px}
.gal input{border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:.8rem;background:var(--paper);width:100%}
.addsec{display:flex;gap:8px}
.addsec select{flex:1;border:1px solid var(--line);border-radius:7px;padding:7px;background:var(--paper)}
.note{background:var(--soft);border-radius:8px;padding:12px 14px;margin-bottom:12px}
.note.ret{background:color-mix(in srgb,var(--thread) 14%,var(--paper))}
.fill{max-width:720px;margin:0 auto;padding:18px 14px 60px}
.fill h2{font-size:1.1rem;margin:22px 0 10px}
.count{font-size:.78rem;color:var(--mute);text-align:right}
.count.over{color:var(--thread)}
.req{color:var(--thread)}
.center{max-width:560px;margin:10vh auto;padding:24px;background:var(--paper);border:1px solid var(--line);border-radius:10px}
.center h2{margin:0 0 8px}
.steps{list-style:none;padding:0;margin:20px 0;display:grid;gap:10px}
.steps li{display:flex;gap:10px;align-items:center;color:var(--mute)}
.steps li::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid var(--line);flex:none}
.steps li.done{color:var(--ink)}
.steps li.done::before{background:var(--ok);border-color:var(--ok)}
.steps li.now{color:var(--ink);font-weight:700}
.steps li.now::before{border-color:var(--denim);background:var(--soft)}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);max-width:460px;width:calc(100% - 32px);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:7px;padding:8px;background:var(--bg);margin:10px 0}
.dlg-act{display:flex;justify-content:flex-end;gap:8px}
.hint{position:sticky;bottom:0;z-index:2;margin-top:12px;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));font-size:.88rem;box-shadow:0 -2px 8px rgba(0,0,0,.08)}
.hint p{margin:0}
.hint p+p{margin-top:6px;color:var(--mute)}
.prog .ph{display:flex;justify-content:space-between;gap:8px;font-weight:700;margin-bottom:6px}
.prog .track{height:8px;border-radius:99px;background:var(--paper);border:1px solid var(--line);overflow:hidden}
.prog .track i{display:block;height:100%;background:var(--denim);transition:width .25s}
.prog ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.prog ul .btn{width:100%;text-align:left}
.prog .ok{margin:10px 0 0;color:var(--ok);font-weight:700}
</style>

  <textarea id="tNote" data-ph="note_ph" maxlength="2000"></textarea>

</dialog>

const filled = (v) => { const t = String(v ?? "").trim(); return t !== "" && !/\[[^\]]*\]/.test(t); };
function checklist() {
  const c = S.data.content, b = c.business || {}, secs = c.sections || [];
  const bp = (k) => `[data-p="content.business.${k}"]`;
  const out = [];
  const add = (key, ok, panel, sel) => out.push({ key, ok, panel, sel });
  add("p_name", filled(b.name), "business", bp("name"));
  add("p_tagline", filled(b.tagline), "business", bp("tagline"));
  add("p_logo", filled(b.logo), "business", '[data-up="content.business.logo"]');
  add("p_contact", filled(b.phone) || filled(b.email), "business", filled(b.phone) ? bp("email") : bp("phone"));
  add("p_address", filled(b.address), "business", bp("address"));
  const hrs = Array.isArray(b.hours) ? b.hours : [];
  add("p_hours", hrs.some((h) => h && !h.closed && filled(h.open) && filled(h.close)), "business", bp("hours.0.open"));
  const textOf = (type) => {
    const ix = secs.map((s, i) => (s.type === type ? i : -1)).filter((i) => i >= 0);
    return { ok: ix.some((i) => filled(secs[i].text)), sel: ix.length ? `[data-p="content.sections.${ix[0]}.text"]` : "#newSec" };
  };
  const h = textOf("hero"); add("p_hero", h.ok, "sections", h.sel);
  const a = textOf("about"); add("p_about", a.ok, "sections", a.sel);
  secs.forEach((s, i) => {
    if (s.type === "menu") {
      const groups = s.groups || [];
      let n = 0, sel = groups.length ? "" : `[data-act="addgroup"][data-i="${i}"]`;
      groups.forEach((g, gi) => {
        const items = g.items || [];
        items.forEach((it, ii) => { if (filled(it.name)) n++; else if (!sel) sel = `[data-p="content.sections.${i}.groups.${gi}.items.${ii}.name"]`; });
      });
      if (!sel) sel = `[data-act="additem"][data-i="${i}"][data-g="${groups.length - 1}"]`;
      add("p_menu", n >= 3, "sections", sel);
    } else if (s.type === "gallery") {
      add("p_gallery", (s.images || []).filter((g) => g && filled(g.url)).length >= 3, "sections", `[data-upgal="content.sections.${i}.images"]`);
    }
  });
  return out;
}
function progInner() {

function hintKeyOf(el) {
  const p = el.dataset.p || el.dataset.up; if (!p) return null;
  const B = { "content.business.name": "name", "content.business.tagline": "tagline", "content.business.logo": "logo", "content.business.phone": "phone", "content.business.email": "email", "content.business.address": "address" };
  if (B[p]) return B[p];
  if (p.startsWith("content.business.hours.")) return "hours";
  if (p.startsWith("content.business.socials.")) return "socials";
  const m = p.match(/^content\.sections\.(\d+)\.(.+)$/); if (!m) return null;
  const type = S.data.content.sections?.[m[1]]?.type, r = m[2];
  if (r === "title") return type === "hero" ? "hero_title" : null;
  if (r === "text") return type === "hero" ? "hero_text" : type === "about" ? "about_text" : null;
  if (r === "button.label") return "hero_btn_label";
  if (r === "button.url") return "hero_btn_url";
  if (r === "image_alt" || /^images\.\d+\.alt$/.test(r)) return "image_alt";
  if (/^images\.\d+\.caption$/.test(r)) return "caption";
  if (/^groups\.\d+\.name$/.test(r)) return "group";
  const it = r.match(/^groups\.\d+\.items\.\d+\.(name|price|desc)$/);
  return it ? (it[1] === "name" ? "item" : it[1]) : null;
}
function hintInner(key) {
  const ex = key === "hero_text" || key === "about_text" ? `<p><b>${T("h_ex")}</b> ${esc(T(`ex_${key}_${S.sector}`))}</p>` : "";
  return `<p>${esc(T("h_" + key))}</p>${ex}`;
}

function getP(path) { return path.split(".").reduce((o, k) => (o == null ? undefined : o[k]), S.data); }

async function load() {
  try {
    if(S.local){
      S.site={name:"Mr. Space",slug:"preview",mode:"builder"}; S.build={id:0,status:"draft"};
      try{const saved=JSON.parse(localStorage.getItem("ms-builder-local-preview")||"null");if(saved?.content?.business && Array.isArray(saved.content.sections)) S.data=saved;}catch{}
      if(!S.data.content?.business)S.data={content:R.example(MsCatalog.entries.find(e=>e.id===P.get("design")&&e.kind==="design")?.preset||"commerce",LANG),theme:{preset:MsCatalog.entries.find(e=>e.id===P.get("design")&&e.kind==="design")?.preset||"commerce"}};
      resilience.serverLoaded(); return draw();
    }
    if (P.get("t") || P.get("ta") || P.has("try")) return await loadTrial();
    if (P.get("b")) {
      if (!(await window.msAdminGate(sb, { panel: "../admin/" }))) return;
      S.admin = true;
      const { data: b, error } = await sb.from("ms_builds").select("*").eq("id", P.get("b")).single();
      if (error) throw error;
      const { data: s } = await sb.from("ms_sites").select("*").eq("slug", b.site).single();
      S.site = { name: s.name, slug: s.slug, mode: s.mode, schema: s.field_schema, host: s.host };
      S.key = s.site_key;
      S.build = b;
    } else {
      if (!/^[0-9a-f-]{36}$/i.test(S.key)) throw new Error("bad");
      const { data, error } = await sb.rpc("ms_builder_get", { p_key: S.key });
      if (error || !data) throw error || new Error("bad");
      S.site = data.site; S.build = data.build;
    }
    S.data.content = S.build.content && Object.keys(S.build.content).length ? S.build.content
      : (S.site.mode === "builder" ? R.starter(S.site.name, LANG) : {});
    S.data.theme = S.build.theme && Object.keys(S.build.theme).length ? S.build.theme : { preset: "liman" };
    document.title = `${S.site.name} · Mr. Space`;
    resilience.serverLoaded(); draw();
  } catch (e) {
    root.innerHTML = `<div class="center"><h2>Mr. Space</h2><p>${T("bad_link")}</p></div>`;
    resilience.loadFailed();
  }
}

function drawFill() {
  const fields = S.site.schema?.fields || [];
  const c = S.data.content;
  let html = barHTML() + `<div class="fill">${returnedHTML()}<p class="note">${esc(S.site.schema?.intro || T("fill_intro"))}</p>`;
  if (!fields.length) { root.innerHTML = html + `<p>${T("no_fields")}</p></div>`; bindSend(); return; }
  let group = null;
  for (const f of fields) {
    if (f.group && f.group !== group) { group = f.group; html += `<h2>${esc(group)}</h2>`; }
    const path = `content.${f.key.replace(/\./g, "_")}`;
    const label = `${f.label || f.key}${f.required ? ` <span class="req" title="${T("required")}">*</span>` : ""}`;
    const hint = f.hint ? `<span style="font-size:.8rem">${esc(f.hint)}</span>` : "";
    const max = f.max ? `maxlength="${Number(f.max) * 1.2 | 0}" data-max="${Number(f.max)}"` : "";
    if (f.type === "image") html += imgField(f.label || f.key, path) + hint;
    else if (f.type === "list") html += `<label class="f">${label}${hint}<textarea data-p="${path}" data-list="1" placeholder="${T("list_hint")}">${esc((getP(path) || []).join("\n"))}</textarea></label>`;
    else if (f.type === "textarea") html += `<label class="f">${label}${hint}<textarea data-p="${path}" ${max}>${esc(getP(path) ?? "")}</textarea>${f.max ? `<span class="count" data-for="${path}"></span>` : ""}</label>`;
    else html += `<label class="f">${label}${hint}<input type="${f.type === "url" ? "url" : "text"}" data-p="${path}" value="${esc(getP(path) ?? "")}" ${max}>${f.max ? `<span class="count" data-for="${path}"></span>` : ""}</label>`;
  }
  root.innerHTML = html + `</div>`;
  root.querySelectorAll("[data-max]").forEach(counter);
  bindSend();
}
function counter(el) {
  const c = root.querySelector(`.count[data-for="${el.dataset.p}"]`); if (!c) return;
  const n = el.value.length, m = Number(el.dataset.max);
  c.textContent = `${n} / ${m}`; c.classList.toggle("over", n > m);
}

let svT, saving = Promise.resolve(true), dirtyRevision = 0, saveState = "saved";
function markSaved(state) {
  saveState=state;
  const el = document.getElementById("saved"); if (!el) return;
  el.textContent = T(state); el.classList.toggle("err", state === "save_err");
}
function schedule() { dirtyRevision++; resilience.persist(); markSaved("saving"); clearTimeout(svT); svT = setTimeout(save, 900); }
function save() {
  clearTimeout(svT);
  const revision=dirtyRevision, content=structuredClone(S.data.content), theme=structuredClone(S.data.theme), journal=resilience.persist();
  saving = saving.then(async () => {
    try {
      if(!resilience.canSave()){markSaved(resilience.fail()?"device_saved":"save_err");return false;}
      let error;
      if(S.local){localStorage.setItem("ms-builder-local-preview",JSON.stringify({content,theme}));}
      else if (S.trial && S.admin) ({ error } = await sb.from("ms_trials").update({ content, theme, updated_at: new Date().toISOString() }).eq("id", S.trialId));
      else if (S.trial) ({ error } = await sb.rpc("ms_trial_save", { p_token: S.token, p_content: content, p_theme: theme }));
      else if (S.admin) ({ error } = await sb.from("ms_builds").update({ content, theme, updated_at: new Date().toISOString() }).eq("id", S.build.id));
      else ({ error } = await sb.rpc("ms_builder_save", { p_key: S.key, p_build: S.build.id, p_content: content, p_theme: theme }));
      if(error) { markSaved(resilience.fail()?"device_saved":"save_err"); return false; }
      resilience.acknowledge(journal);markSaved(revision===dirtyRevision ? "saved" : "saving");refreshProg();
      return revision===dirtyRevision;
    } catch { markSaved(resilience.fail()?"device_saved":"save_err"); return false; }
  });
  return saving;
}

// ---------- olaylar ----------
root.addEventListener("input", (e) => {
  const el = e.target; const p = el.dataset.p; if (!p) return;
  let v = el.type === "checkbox" ? el.checked : el.value;
  if (el.dataset.num) v = Number(v);
  if (el.dataset.list) v = el.value.split("\n").map((x) => x.trim()).filter(Boolean);
  if (p.startsWith("theme.colors") || p.startsWith("theme.fonts") || p === "theme.layout" || p === "theme.radius") {
    if (!S.data.theme.colors && p.startsWith("theme.colors")) S.data.theme.colors = { ...R.themeOf(S.data.theme).colors };
  }
  setP(p, v);
  if (el.dataset.max) counter(el);
  schedule(); preview();
});
root.addEventListener("change", async (e) => {
  const el = e.target;
  if(el.hasAttribute('data-interface-language')){el.disabled=true;if(await save()){try{localStorage.setItem('ms_lang',el.value);}catch{}location.reload();}else{el.disabled=false;el.value=LANG;alert(T('save_err'));}return;}
  if (el.dataset.up || el.dataset.upgal) {
    const files = [...el.files]; if (!files.length) return;
    if(S.local){for(const file of files){if(!["image/jpeg","image/png","image/webp"].includes(file.type)||file.size>5*1024*1024){alert(T("upload_err"));continue;}const url=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error("image_read"));reader.readAsDataURL(file);});if(el.dataset.up)setP(el.dataset.up,url);else{const arr=getP(el.dataset.upgal)||[];arr.push({url,alt:"",caption:""});setP(el.dataset.upgal,arr);}}schedule();draw();return;}
    const holder = el.parentElement; const old = holder.firstChild.textContent;
    holder.firstChild.textContent = T("uploading") + "…";
    try {
      for (const file of files) {
        const fd = new FormData(); if (S.trial) fd.append("trial", S.token); else fd.append("key", S.key); fd.append("file", file);
        const r = await fetch(C.fn, { method: "POST", body: fd, headers: { apikey: C.anon } });
        const j = await r.json();
        if (!r.ok || !j.url) throw new Error(j.error || "upload");
        if (el.dataset.up) setP(el.dataset.up, j.url);
        else { const arr = getP(el.dataset.upgal) || []; arr.push({ url: j.url, alt: "", caption: "" }); setP(el.dataset.upgal, arr); }
      }
      schedule(); draw();
    } catch { holder.firstChild.textContent = old; alert(T("upload_err")); }
  }
});
root.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const c = S.data.content, a = b.dataset.act, i = Number(b.dataset.i), g = Number(b.dataset.g);
  if (a === "guide") { S.guide=b.dataset.step;draw();return; }
  if (a === "device") { S.device=b.dataset.device;draw();return; }
  if (a === "view") { S.view = b.dataset.v; draw(); return; }
  if (a === "preset") { S.data.theme = { preset: b.dataset.k }; }
  else if (a === "clear") setP(b.dataset.path, "");
  else if (a === "addsec") {
    const type = document.getElementById("newSec").value;
    const s = { type, title: "" };
    if (type === "menu") s.groups = [{ name: "", items: [{ name: "", price: "", desc: "" }] }];
    if (type === "gallery") s.images = [];
    c.sections.push(s);
  }
  else if (a === "delsec") c.sections.splice(i, 1);
  else if (a === "move") { const j = i + Number(b.dataset.d); [c.sections[i], c.sections[j]] = [c.sections[j], c.sections[i]]; }
  else if (a === "addgroup") (c.sections[i].groups ||= []).push({ name: "", items: [{ name: "", price: "", desc: "" }] });
  else if (a === "delgroup") c.sections[i].groups.splice(g, 1);
  else if (a === "additem") (c.sections[i].groups[g].items ||= []).push({ name: "", price: "", desc: "" });
  else if (a === "delitem") c.sections[i].groups[g].items.splice(Number(b.dataset.it), 1);
  else if (a === "delimg") c.sections[i].images.splice(g, 1);
  else return;
  const open = [...root.querySelectorAll("details.panel")].map((d) => d.open);
  const y = root.querySelector(".editor")?.scrollTop || 0;
  schedule(); draw();
  root.querySelectorAll("details.panel").forEach((d, k) => { if (open[k] != null) d.open = open[k]; });
  const ed = root.querySelector(".editor"); if (ed) ed.scrollTop = y;
});

// ---------- gonderme ----------
function bindSend() {
  const btn = document.getElementById("sendBtn"); if (!btn) return;
  const dlg = document.getElementById(S.trial ? "trialDlg" : "sendDlg");
  btn.onclick = () => dlg.showModal();
  const cl = document.getElementById("copyLink");
  if (cl) cl.onclick = async () => { try { await navigator.clipboard.writeText(location.href); cl.textContent = T("copied"); } catch (e) {} };
}
document.getElementById("sendCancel").onclick = () => document.getElementById("sendDlg").close();
document.getElementById("sendGo").onclick = async (e) => {
  e.target.disabled = true;
  if(!(await save())) { e.target.disabled=false;alert(T("save_err"));return; }
  const { error } = await sb.rpc("ms_builder_submit", { p_key: S.key, p_build: S.build.id, p_note: document.getElementById("sendNote").value || null });
  e.target.disabled = false;
  if (error) { alert(T("save_err")); return; }
  document.getElementById("sendDlg").close();
  load();
};
const _draw = draw;
draw = function () { _draw(); bindSend(); resilience.render(); };
window.addEventListener("beforeunload", (e) => { if (saveState !== "saved") { e.preventDefault(); e.returnValue = ""; } });

// ---------- ucretsiz deneme (misafir) ----------
const SECTORS = {
  cafe: ["Café", "Kafe", "Cafetería", "Café", "Café"], bakery: ["Bakery", "Pastane", "Pastelería", "Bäckerei", "Pâtisserie"],
  bar: ["Bar / restaurant", "Bar / restoran", "Bar / restaurante", "Bar / Restaurant", "Bar / restaurant"],
  tailor: ["Tailor", "Terzi", "Sastrería", "Schneiderei", "Retouches / tailleur"], florist: ["Florist", "Çiçekçi", "Floristería", "Blumenladen", "Fleuriste"],
  boutique: ["Boutique / vintage", "Butik / vintage", "Boutique / vintage", "Boutique / Vintage", "Boutique / vintage"], other: ["Other", "Diğer", "Otro", "Andere", "Autre"],
};
function trialStarter(sector, name, lang) {
  const i = { en: 0, tr: 1, es: 2, de: 3, fr: 4 }[lang] ?? 0;
  const L = (...v) => v[i] ?? v[0];
  const item = (n) => ({ name: `[${L("Item", "Ürün", "Producto", "Artikel", "Article")} ${n}]`, price: L("[$]", "[₺]", "[€]", "[€]", "[€]"),
    desc: L("[Short description]", "[Kısa açıklama]", "[Descripción corta]", "[Kurze Beschreibung]", "[Courte description]") });
  const menu = (title, group) => ({ type: "menu", title, groups: [{ name: group, items: [item(1), item(2), item(3)] }] });
  const chosen=MsCatalog.entries.find(e=>e.id===P.get("design")&&e.kind==="design");
  const preset = chosen?.preset || ({ cafe: "table", bakery: "table", bar: "table", tailor: "atelier", florist: "commerce", boutique: "commerce" }[sector] || "commerce");
  const sections = [
    { type: "hero", title: name || L("[Your business name]", "[İşletmenizin adı]", "[Nombre de tu negocio]", "[Name deines Unternehmens]", "[Nom de votre entreprise]"),
      text: L("[A short welcome. What makes you special?]", "[Kısa bir karşılama. Sizi özel yapan ne?]", "[Una bienvenida corta. ¿Qué te hace especial?]", "[Eine kurze Begrüßung. Was macht dich besonders?]", "[Un court mot d'accueil. Qu'est-ce qui vous rend unique ?]"),
      image: "", button: { label: L("Find us", "Bize ulaşın", "Encuéntranos", "So findest du uns", "Nous trouver"), url: "" } },
    { type: "about", title: L("About us", "Hakkımızda", "Sobre nosotros", "Über uns", "À propos"),
      text: L("[Your story in a few sentences.]", "[Hikayeniz birkaç cümleyle.]", "[Tu historia en pocas frases.]", "[Deine Geschichte in ein paar Sätzen.]", "[Votre histoire en quelques phrases.]"), image: "" },
  ];
  if (["cafe", "bakery", "bar"].includes(sector)) sections.push(menu(L("Menu", "Menü", "Menú", "Speisekarte", "Carte"), L("[Group, e.g. Coffee]", "[Grup, ör. Kahveler]", "[Grupo, p. ej. Cafés]", "[Gruppe, z. B. Kaffee]", "[Groupe, ex. Cafés]")));
  if (sector === "tailor") sections.push(menu(L("Services & prices", "Hizmetler ve fiyatlar", "Servicios y precios", "Leistungen & Preise", "Services et tarifs"), L("[Alterations]", "[Tadilat]", "[Arreglos]", "[Änderungen]", "[Retouches]")));
  if (sector === "florist") sections.push(menu(L("Bouquets", "Buketler", "Ramos", "Sträuße", "Bouquets"), L("[Seasonal]", "[Mevsimlik]", "[De temporada]", "[Saisonal]", "[De saison]")));
  if (["bakery", "florist", "boutique", "bar", "other"].includes(sector)) sections.push({ type: "gallery", title: L("Gallery", "Galeri", "Galería", "Galerie", "Galerie"), images: [] });
  sections.push({ type: "hours", title: "" }, { type: "contact", title: "" });
  const content = R.starter(name, lang);
  content.business.tagline = L("[One line about you]", "[Sizi anlatan tek cümle]", "[Una frase sobre ti]", "[Ein Satz über dich]", "[Une phrase sur vous]");
  content.sections = sections;
  return { content, theme: { preset } };
}

async function loadTrial() {
  S.trial = true;
  if (P.get("ta")) {
    if (!(await window.msAdminGate(sb, { panel: "../admin/" }))) return;
    S.admin = true;
    const { data: t, error } = await sb.from("ms_trials").select("*").eq("id", P.get("ta")).single();
    if (error) throw error;
    S.trialId = t.id; S.token = t.token;
    S.site = { name: t.business || t.content?.business?.name || "Deneme", mode: "builder" };
    S.build = { id: t.id, status: t.status };
    S.data.content = t.content; S.data.theme = t.theme;
    resilience.serverLoaded(); return draw();
  }
  if (P.get("t")) {
    S.token = P.get("t");
    const { data, error } = await sb.rpc("ms_trial_get", { p_token: S.token });
    if (error || !data) throw error || new Error("bad");
    S.site = { name: data.content?.business?.name || "Mr. Space", mode: "builder" };
    S.build = { id: 0, status: data.status, preview_key: data.preview_key };
    S.data.content = data.content; S.data.theme = data.theme;
    S.sector = HINT_SECTORS.includes(data.sector) ? data.sector : "other";
    resilience.serverLoaded(); return draw();
  }
  drawStart();
}

function drawStart() {
  document.title = T("try_title") + " · Mr. Space";
  root.innerHTML = `<div class="center"><h2>${T("try_title")}</h2><p>${T("try_text")}</p>
    <label class="f">${T("try_name")}<input id="tName" maxlength="80" autocomplete="organization"></label>
    <div class="presets" id="tSec" style="margin:14px 0">${Object.entries(SECTORS).map(([k, v], i) =>
      `<button class="preset" data-sec="${k}" aria-pressed="${i === 0}" style="min-width:auto;padding:8px 12px">${esc(v[LI] ?? v[0])}</button>`).join("")}</div>
    <button class="btn main" id="tGo">${T("try_start")}</button><p class="saved err" id="tErr"></p></div>`;
  let sec = "cafe";
  document.getElementById("tSec").onclick = (e) => {
    const b = e.target.closest("[data-sec]"); if (!b) return;
    sec = b.dataset.sec;
    document.querySelectorAll("#tSec [data-sec]").forEach((x) => x.setAttribute("aria-pressed", x === b));
  };
  document.getElementById("tGo").onclick = async (e) => {
    e.target.disabled = true;
    const st = trialStarter(sec, document.getElementById("tName").value.trim(), LANG);
    const { data, error } = await sb.rpc("ms_trial_start", { p_sector: sec, p_lang: LANG, p_content: st.content, p_theme: st.theme });
    if (error || !data?.token) { e.target.disabled = false; document.getElementById("tErr").textContent = /busy|too_many/.test(error?.message || "") ? T("t_busy") : T("save_err"); return; }
    location.search = "?t=" + data.token;
  };
}

function drawTrialDone() {
  const pk = S.build.preview_key;
  root.innerHTML = `<div class="center"><h2>${pk ? T("t_ready") : T("t_done_title")}</h2>
    ${pk ? `<p><a class="btn main" href="../preview/?p=${esc(pk)}">${T("t_open")}</a></p>` : `<p>${T("t_done_text")}</p>`}</div>`;
}

document.getElementById("tCancel").onclick = () => document.getElementById("trialDlg").close();
document.getElementById("tGo2").onclick = async (e) => {
  const v = (id) => document.getElementById(id).value.trim();
  if (v("tN").length < 2 || !/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(v("tE"))) { document.getElementById("tDErr").textContent = T("t_bad"); return; }
  e.target.disabled = true;
  if(!(await save())) { e.target.disabled=false;document.getElementById("tDErr").textContent=T("save_err");return; }
  const { error } = await sb.rpc("ms_trial_submit", {
    p_token: S.token, p_path: document.querySelector('input[name="tPath"]:checked').value,
    p_name: v("tN"), p_email: v("tE"), p_phone: v("tP") || null,
    p_business: S.data.content?.business?.name || null, p_note: v("tNote") || null,
    p_consent: document.getElementById("tC").checked,
  });
  e.target.disabled = false;
  if (error) { document.getElementById("tDErr").textContent = /bad_/.test(error.message) ? T("t_bad") : T("save_err"); return; }
  document.getElementById("trialDlg").close();
  S.build.status = "submitted"; draw();
};

MsPlatform.ready.then(async()=>{await resilience.init();await load();}).catch(()=>MsPlatform.fail('root'));
