<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Mr. Space</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef0f2; --paper:#fff; --ink:#1c2430; --mute:#5d6878; --line:#d5dae1; --denim:#2f4a6b; --soft:#dfe6ef; --thread:#b5502e; --ok:#2e6b4a;
  --sans:"Familjen Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root{--bg:#141922;--paper:#1d2430;--ink:#e8ecf1;--mute:#9aa5b4;--line:#2e3746;--denim:#8fb0d6;--soft:#26344a;--thread:#e08a68;--ok:#7fc39c}}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--denim);outline-offset:2px}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));margin-top:calc(-1 * env(safe-area-inset-top,0px))}
.bar h1{font-size:1.05rem;margin:0;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.saved{color:var(--mute);font-size:.85rem;white-space:nowrap}
.saved.err{color:var(--thread)}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 12px;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--denim)}
.btn.main{background:var(--denim);border-color:var(--denim);color:var(--paper)}
.btn.small{padding:3px 8px;font-size:.85rem}
.btn.danger{color:var(--thread)}
.btn:disabled{opacity:.5;cursor:default}
.layout{display:grid;grid-template-columns:minmax(320px,440px) 1fr;height:calc(100% - 52px)}
.editor{overflow-y:auto;padding:14px;border-right:1px solid var(--line)}
.preview{position:relative;background:var(--line)}
.preview iframe{width:100%;height:100%;border:0;background:#fff}
.switch{display:none}
@media (max-width:860px){
  .layout{grid-template-columns:1fr;height:auto}
  .layout[data-view="edit"] .preview{display:none}
  .layout[data-view="preview"] .editor{display:none}
  .preview{height:calc(100vh - 110px)}
  .switch{display:flex;gap:4px;padding:8px 14px 0}
  .switch button[aria-pressed="true"]{background:var(--denim);color:var(--paper);border-color:var(--denim)}
}
details.panel{background:var(--paper);border:1px solid var(--line);border-radius:8px;margin-bottom:12px}
details.panel>summary{cursor:pointer;padding:12px 14px;font-weight:700;list-style:none}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary::after{content:"+";float:right;color:var(--mute)}
details.panel[open]>summary::after{content:"–"}
.pbody{padding:0 14px 14px;display:grid;gap:12px}
label.f{display:grid;gap:4px;font-size:.88rem;color:var(--mute)}
label.f input,label.f textarea,label.f select{color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%}
label.f textarea{min-height:90px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.presets{display:flex;flex-wrap:wrap;gap:8px}
.preset{border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--paper);cursor:pointer;display:grid;gap:4px;font-size:.82rem;min-width:74px}
.preset[aria-pressed="true"]{border-color:var(--denim);box-shadow:0 0 0 1px var(--denim)}
.preset .sw{display:flex;height:22px;border-radius:4px;overflow:hidden}
.preset .sw i{flex:1}
.colors{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.colors label{display:grid;gap:4px;font-size:.8rem;color:var(--mute)}
.colors input{width:100%;height:36px;border:1px solid var(--line);border-radius:6px;padding:2px;background:var(--paper)}
.hours{display:grid;gap:6px}
.hours .h{display:grid;grid-template-columns:90px 1fr 1fr auto;gap:6px;align-items:center;font-size:.85rem}
.hours input[type=time]{border:1px solid var(--line);border-radius:6px;padding:5px;background:var(--bg);width:100%}
.sec{border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:10px;background:var(--bg)}
.sec .sh{display:flex;align-items:center;gap:6px}
.sec .sh b{flex:1}
.img{display:flex;gap:10px;align-items:center}
.img img{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:var(--paper)}
.img .ph{width:64px;height:64px;border-radius:6px;border:1px dashed var(--line);display:grid;place-items:center;color:var(--mute);font-size:.75rem}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.grp{border-left:3px solid var(--soft);padding-left:10px;display:grid;gap:8px}
.it{display:grid;grid-template-columns:1fr 90px auto;gap:6px}
.it input{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--paper);width:100%}
.it .d{grid-column:1/3}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.gal .g{display:grid;gap:4px}
.gal img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:6px}
.gal input{border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:.8rem;background:var(--paper);width:100%}
.addsec{display:flex;gap:8px}
.addsec select{flex:1;border:1px solid var(--line);border-radius:7px;padding:7px;background:var(--paper)}
.note{background:var(--soft);border-radius:8px;padding:12px 14px;margin-bottom:12px}
.note.ret{background:color-mix(in srgb,var(--thread) 14%,var(--paper))}
.fill{max-width:720px;margin:0 auto;padding:18px 14px 60px}
.fill h2{font-size:1.1rem;margin:22px 0 10px}
.count{font-size:.78rem;color:var(--mute);text-align:right}
.count.over{color:var(--thread)}
.req{color:var(--thread)}
.center{max-width:560px;margin:10vh auto;padding:24px;background:var(--paper);border:1px solid var(--line);border-radius:10px}
.center h2{margin:0 0 8px}
.steps{list-style:none;padding:0;margin:20px 0;display:grid;gap:10px}
.steps li{display:flex;gap:10px;align-items:center;color:var(--mute)}
.steps li::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid var(--line);flex:none}
.steps li.done{color:var(--ink)}
.steps li.done::before{background:var(--ok);border-color:var(--ok)}
.steps li.now{color:var(--ink);font-weight:700}
.steps li.now::before{border-color:var(--denim);background:var(--soft)}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);max-width:460px;width:calc(100% - 32px);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:7px;padding:8px;background:var(--bg);margin:10px 0}
.dlg-act{display:flex;justify-content:flex-end;gap:8px}
</style>
</head>
<body>
<div id="root"><div class="center" id="loading">…</div></div>

<dialog id="sendDlg">
  <h2 style="margin:0 0 6px;font-size:1.15rem" data-t="send_title"></h2>
  <p style="margin:0;color:var(--mute)" data-t="send_text"></p>
  <textarea id="sendNote" maxlength="2000"></textarea>
  <div class="dlg-act"><button class="btn" id="sendCancel" data-t="cancel"></button><button class="btn main" id="sendGo" data-t="confirm_send"></button></div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../assets/ms-config.js"></script>
<script src="../assets/ms-render.js"></script>
<script>
const LANG = (navigator.language || "en").toLowerCase().startsWith("tr") ? "tr" : "en";
document.documentElement.lang = LANG;
const DICT = {
  saved:["Saved","Kaydedildi"], saving:["Saving","Kaydediliyor"], save_err:["Not saved. Check your connection.","Kaydedilemedi. Bağlantıyı kontrol edin."],
  send:["Send for review","İncelemeye gönder"], edit:["Edit","Düzenle"], preview:["Preview","Önizle"],
  look:["Look","Görünüm"], business:["Business","İşletme"], sections:["Sections","Bölümler"],
  style:["Style","Stil"], bg:["Background","Arka plan"], ink:["Text","Yazı"], accent:["Accent","Vurgu"], soft:["Band","Ara bant"],
  head_font:["Heading font","Başlık yazı tipi"], body_font:["Body font","Metin yazı tipi"], layout:["Layout","Yerleşim"],
  left:["Left aligned","Sola yaslı"], center:["Centered","Ortalı"], corners:["Corner roundness","Köşe yuvarlaklığı"], site_lang:["Site language","Site dili"],
  name:["Business name","İşletme adı"], tagline:["Short description","Kısa tanım"], logo:["Logo","Logo"], phone:["Phone","Telefon"],
  email:["Email","E-posta"], address:["Address","Adres"], hours:["Opening hours","Çalışma saatleri"], closed:["Closed","Kapalı"],
  socials:["Links","Bağlantılar"], website:["Other website","Diğer site"],
  s_title:["Title","Başlık"], s_text:["Text","Metin"], image:["Image","Görsel"], image_alt:["Image description","Görsel açıklaması"],
  btn_label:["Button text","Buton yazısı"], btn_url:["Button link","Buton linki"],
  group:["Group name","Grup adı"], item:["Item","Ürün"], price:["Price","Fiyat"], desc:["Description","Açıklama"],
  add_item:["Add item","Ürün ekle"], add_group:["Add group","Grup ekle"], del:["Remove","Kaldır"], up:["Up","Yukarı"], down:["Down","Aşağı"],
  add_section:["Add section","Bölüm ekle"], add_images:["Add photos","Fotoğraf ekle"], caption:["Caption","Alt yazı"],
  upload:["Upload","Yükle"], uploading:["Uploading","Yükleniyor"], upload_err:["Upload failed. JPG, PNG or WebP up to 5 MB.","Yüklenemedi. 5 MB'a kadar JPG, PNG ya da WebP."],
  send_title:["Send your site for review","Sitenizi incelemeye gönderin"],
  send_text:["Our team will check and finish your site. Editing is closed while we work on it.","Ekibimiz sitenizi kontrol edip son halini verecek. Bu sürede düzenleme kapalı olur."],
  note_ph:["Anything we should know? (optional)","Bilmemiz gereken bir şey var mı? (isteğe bağlı)"],
  cancel:["Cancel","Vazgeç"], confirm_send:["Send","Gönder"],
  returned:["We sent your site back with a note:","Sitenizi bir notla geri gönderdik:"],
  wait_title:["Your site is being prepared","Siteniz hazırlanıyor"],
  wait_text:["Our team is checking and finishing your site. It usually takes 24 to 48 hours. You can follow it on this page.","Ekibimiz sitenizi kontrol edip son halini veriyor. Genelde 24-48 saat sürer. Bu sayfadan takip edebilirsiniz."],
  st_sent:["Sent","Gönderildi"], st_check:["Checks","Kontroller"], st_finish:["Finishing touches","Son dokunuşlar"], st_live:["Live","Yayında"],
  live_title:["Your site is live","Siteniz yayında"], open_site:["Open site","Siteyi aç"],
  changes:["Need a change? Send it from your request page.","Değişiklik mi gerekiyor? Talep sayfanızdan gönderin."], request_page:["Request page","Talep sayfası"],
  no_fields:["Your fields are being prepared. Please check back soon.","Alanlarınız hazırlanıyor. Kısa süre sonra tekrar bakın."],
  bad_link:["This link is not valid. Ask us for a new one.","Bu link geçersiz. Bizden yenisini isteyin."],
  admin_back:["Back to review","İncelemeye dön"],
  fill_intro:["Fill in the fields below. We will place everything into your design and finish it.","Aşağıdaki alanları doldurun. Hepsini tasarımınıza biz yerleştirip son halini vereceğiz."],
  list_hint:["One per line","Her satıra bir tane"], required:["Required","Zorunlu"], other:["Other","Diğer"],
};
const T = (k) => (DICT[k] || [k, k])[LANG === "tr" ? 1 : 0];
document.querySelectorAll("[data-t]").forEach((el) => el.textContent = T(el.dataset.t));
document.getElementById("sendNote").placeholder = T("note_ph");

const C = window.MS_CONFIG;
const sb = supabase.createClient(C.url, C.anon);
const R = window.MsRender;
const P = new URLSearchParams(location.search);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const root = document.getElementById("root");
const FONT_SUGGEST = ["Bricolage Grotesque","Source Sans 3","Young Serif","Work Sans","Syne","Manrope","Fraunces","IBM Plex Sans","DM Serif Display","DM Sans","Playfair Display","Lora","Libre Baskerville","Archivo","Outfit","Space Grotesk","Cormorant Garamond","Josefin Sans","Rubik","Karla","Nunito Sans","Merriweather","Bebas Neue","Abril Fatface","Caveat"];

const S = { admin: false, key: P.get("k") || "", site: null, build: null, data: { content: {}, theme: {} }, view: "edit" };

// ---------- yol yardimcilari ----------
function getP(path) { return path.split(".").reduce((o, k) => (o == null ? undefined : o[k]), S.data); }
function setP(path, val) {
  const ks = path.split("."); let o = S.data;
  ks.slice(0, -1).forEach((k, i) => { if (o[k] == null) o[k] = /^\d+$/.test(ks[i + 1]) ? [] : {}; o = o[k]; });
  o[ks[ks.length - 1]] = val;
}

// ---------- yukleme ----------
async function load() {
  try {
    if (P.get("b")) {
      const { data: sess } = await sb.auth.getSession();
      if (!sess.session) { location.href = "../admin/review/?next=" + encodeURIComponent(location.href); return; }
      S.admin = true;
      const { data: b, error } = await sb.from("ms_builds").select("*").eq("id", P.get("b")).single();
      if (error) throw error;
      const { data: s } = await sb.from("ms_sites").select("*").eq("slug", b.site).single();
      S.site = { name: s.name, slug: s.slug, mode: s.mode, schema: s.field_schema, host: s.host };
      S.key = s.site_key;
      S.build = b;
    } else {
      if (!/^[0-9a-f-]{36}$/i.test(S.key)) throw new Error("bad");
      const { data, error } = await sb.rpc("ms_builder_get", { p_key: S.key });
      if (error || !data) throw error || new Error("bad");
      S.site = data.site; S.build = data.build;
    }
    S.data.content = S.build.content && Object.keys(S.build.content).length ? S.build.content
      : (S.site.mode === "builder" ? R.starter(S.site.name, LANG) : {});
    S.data.theme = S.build.theme && Object.keys(S.build.theme).length ? S.build.theme : { preset: "liman" };
    document.title = `${S.site.name} · Mr. Space`;
    draw();
  } catch (e) {
    root.innerHTML = `<div class="center"><h2>Mr. Space</h2><p>${T("bad_link")}</p></div>`;
  }
}

const editable = () => S.build.status === "published" || S.build.status === "archived" ? false
  : S.admin ? true : ["draft", "returned"].includes(S.build.status);

function draw() {
  if (!editable()) return drawLocked();
  if (S.site.mode === "fill") return drawFill();
  drawBuilder();
}

// ---------- kilitli ekran ----------
function drawLocked() {
  const st = S.build.status;
  if (st === "published" || st === "archived") {
    const url = S.site.host ? `https://${S.site.host}/` : `../site/?s=${encodeURIComponent(S.site.slug)}`;
    root.innerHTML = `<div class="center"><h2>${T("live_title")}</h2>
      <p><a class="btn main" href="${esc(url)}" target="_blank" rel="noopener">${T("open_site")}</a></p>
      <p style="color:var(--mute)">${T("changes")}</p>
      ${S.admin ? "" : `<a class="btn" href="../request/?k=${esc(S.key)}">${T("request_page")}</a>`}
      ${S.admin ? `<p><a class="btn" href="../admin/review/">${T("admin_back")}</a></p>` : ""}</div>`;
    return;
  }
  const idx = { checking: 1, review: 2 }[st] ?? 1;
  const steps = ["st_sent", "st_check", "st_finish", "st_live"];
  root.innerHTML = `<div class="center"><h2>${T("wait_title")}</h2><p>${T("wait_text")}</p>
    <ol class="steps">${steps.map((s, i) => `<li class="${i < idx ? "done" : i === idx ? "now" : ""}">${T(s)}${i === 0 && S.build.submitted_at ? ` <span style="color:var(--mute);font-weight:400">${new Date(S.build.submitted_at).toLocaleString(LANG)}</span>` : ""}</li>`).join("")}</ol></div>`;
}

// ---------- ust bar ----------
function barHTML() {
  return `<div class="bar"><h1>${esc(S.site.name)}</h1><span class="saved" id="saved">${T("saved")}</span>
    ${S.admin ? `<a class="btn" href="../admin/review/?b=${S.build.id}">${T("admin_back")}</a>` : `<button class="btn main" id="sendBtn">${T("send")}</button>`}</div>`;
}
function returnedHTML() {
  return S.build.status === "returned" && S.build.return_note
    ? `<div class="note ret"><b>${T("returned")}</b><br>${esc(S.build.return_note).replace(/\n/g, "<br>")}</div>` : "";
}

// ---------- alan parcalari ----------
const inp = (label, path, type = "text", extra = "") =>
  `<label class="f">${esc(label)}<input type="${type}" data-p="${path}" value="${esc(getP(path) ?? "")}" ${extra}></label>`;
const area = (label, path, extra = "") =>
  `<label class="f">${esc(label)}<textarea data-p="${path}" ${extra}>${esc(getP(path) ?? "")}</textarea></label>`;
function imgField(label, path) {
  const v = getP(path);
  return `<div><div style="font-size:.88rem;color:var(--mute);margin-bottom:4px">${esc(label)}</div><div class="img">
    ${v ? `<img src="${esc(v)}" alt="">` : `<span class="ph">${esc(label)}</span>`}
    <span class="btn small filebtn">${T("upload")}<input type="file" accept="image/jpeg,image/png,image/webp,image/gif" data-up="${path}"></span>
    ${v ? `<button class="btn small danger" data-act="clear" data-path="${path}">${T("del")}</button>` : ""}</div></div>`;
}

// ---------- kurucu modu ----------
function drawBuilder() {
  const th = S.data.theme, eff = R.themeOf(th), c = S.data.content;
  const presets = Object.entries(R.PRESETS).map(([k, p]) => `<button class="preset" data-act="preset" data-k="${k}" aria-pressed="${th.preset === k}">
    <span class="sw">${["bg", "ink", "accent", "soft"].map((x) => `<i style="background:${p.colors[x]}"></i>`).join("")}</span>${esc(p.label)}</button>`).join("");
  const days = LANG === "tr" ? ["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"] : ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  if (!Array.isArray(c.business.hours)) c.business.hours = [];
  for (let i = 0; i < 7; i++) c.business.hours[i] = c.business.hours[i] || { open: "", close: "", closed: false };

  root.innerHTML = barHTML() + `
  <div class="switch"><button class="btn small" data-act="view" data-v="edit" aria-pressed="${S.view === "edit"}">${T("edit")}</button><button class="btn small" data-act="view" data-v="preview" aria-pressed="${S.view === "preview"}">${T("preview")}</button></div>
  <div class="layout" data-view="${S.view}">
    <div class="editor">${returnedHTML()}
      <details class="panel" open><summary>${T("look")}</summary><div class="pbody">
        <div class="presets">${presets}</div>
        <div class="colors">${["bg", "ink", "accent", "soft"].map((x) => `<label>${T(x)}<input type="color" data-p="theme.colors.${x}" value="${esc(eff.colors[x])}"></label>`).join("")}</div>
        <div class="row2">
          <label class="f">${T("head_font")}<input list="fonts" data-p="theme.fonts.head" value="${esc(eff.fonts.head)}"></label>
          <label class="f">${T("body_font")}<input list="fonts" data-p="theme.fonts.body" value="${esc(eff.fonts.body)}"></label>
        </div>
        <datalist id="fonts">${FONT_SUGGEST.map((f) => `<option value="${esc(f)}">`).join("")}</datalist>
        <div class="row2">
          <label class="f">${T("layout")}<select data-p="theme.layout"><option value="left" ${eff.layout === "left" ? "selected" : ""}>${T("left")}</option><option value="center" ${eff.layout === "center" ? "selected" : ""}>${T("center")}</option></select></label>
          <label class="f">${T("site_lang")}<select data-p="content.lang"><option value="en" ${c.lang !== "tr" ? "selected" : ""}>English</option><option value="tr" ${c.lang === "tr" ? "selected" : ""}>Türkçe</option></select></label>
        </div>
        <label class="f">${T("corners")}<input type="range" min="0" max="30" data-p="theme.radius" data-num="1" value="${Math.min(30, Number(eff.radius) || 0)}"></label>
      </div></details>

      <details class="panel"><summary>${T("business")}</summary><div class="pbody">
        ${inp(T("name"), "content.business.name")}
        ${inp(T("tagline"), "content.business.tagline", "text", 'maxlength="140"')}
        ${imgField(T("logo"), "content.business.logo")}
        <div class="row2">${inp(T("phone"), "content.business.phone", "tel")}${inp(T("email"), "content.business.email", "email")}</div>
        ${area(T("address"), "content.business.address", 'style="min-height:60px"')}
        <div><div style="font-size:.88rem;color:var(--mute);margin-bottom:6px">${T("hours")}</div><div class="hours">
          ${days.map((d, i) => `<div class="h"><span>${d}</span>
            <input type="time" data-p="content.business.hours.${i}.open" value="${esc(c.business.hours[i].open)}">
            <input type="time" data-p="content.business.hours.${i}.close" value="${esc(c.business.hours[i].close)}">
            <label style="display:flex;gap:4px;align-items:center"><input type="checkbox" data-p="content.business.hours.${i}.closed" ${c.business.hours[i].closed ? "checked" : ""}>${T("closed")}</label></div>`).join("")}
        </div></div>
        <div style="font-size:.88rem;color:var(--mute)">${T("socials")}</div>
        ${["instagram", "facebook", "tiktok", "google", "website"].map((k) => inp(k === "website" ? T("website") : k.charAt(0).toUpperCase() + k.slice(1), `content.business.socials.${k}`, "url", 'placeholder="https://"')).join("")}
      </div></details>

      <details class="panel" open><summary>${T("sections")}</summary><div class="pbody">
        ${(c.sections || []).map(secHTML).join("")}
        <div class="addsec"><select id="newSec">${Object.entries(R.SECTION_TYPES).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join("")}</select>
        <button class="btn" data-act="addsec">${T("add_section")}</button></div>
      </div></details>
    </div>
    <div class="preview"><iframe id="pv" title="${T("preview")}"></iframe></div>
  </div>`;
  preview(true);
}

function secHTML(s, i) {
  const p = `content.sections.${i}`;
  let f = "";
  if (["hero", "about", "text", "menu", "gallery", "hours", "contact"].includes(s.type)) f += inp(T("s_title"), `${p}.title`);
  if (["hero", "about", "text", "menu", "hours", "contact"].includes(s.type)) f += area(T("s_text"), `${p}.text`, s.type === "hero" ? 'style="min-height:60px"' : "");
  if (["hero", "about", "text"].includes(s.type)) f += imgField(T("image"), `${p}.image`) + inp(T("image_alt"), `${p}.image_alt`);
  if (s.type === "hero") f += `<div class="row2">${inp(T("btn_label"), `${p}.button.label`)}${inp(T("btn_url"), `${p}.button.url`, "text", 'placeholder="https:// , tel: , #s3"')}</div>`;
  if (s.type === "menu") {
    f += (s.groups || []).map((g, gi) => `<div class="grp">
      <div style="display:flex;gap:6px;align-items:end"><div style="flex:1">${inp(T("group"), `${p}.groups.${gi}.name`)}</div><button class="btn small danger" data-act="delgroup" data-i="${i}" data-g="${gi}">${T("del")}</button></div>
      ${(g.items || []).map((it, ii) => `<div class="it">
        <input placeholder="${T("item")}" data-p="${p}.groups.${gi}.items.${ii}.name" value="${esc(it.name)}">
        <input placeholder="${T("price")}" data-p="${p}.groups.${gi}.items.${ii}.price" value="${esc(it.price)}">
        <button class="btn small danger" data-act="delitem" data-i="${i}" data-g="${gi}" data-it="${ii}" aria-label="${T("del")}">×</button>
        <input class="d" placeholder="${T("desc")}" data-p="${p}.groups.${gi}.items.${ii}.desc" value="${esc(it.desc)}"></div>`).join("")}
      <button class="btn small" data-act="additem" data-i="${i}" data-g="${gi}">${T("add_item")}</button></div>`).join("");
    f += `<button class="btn small" data-act="addgroup" data-i="${i}">${T("add_group")}</button>`;
  }
  if (s.type === "gallery") {
    f += `<div class="gal">${(s.images || []).map((g, gi) => `<div class="g"><img src="${esc(g.url)}" alt="">
      <input placeholder="${T("image_alt")}" data-p="${p}.images.${gi}.alt" value="${esc(g.alt)}">
      <input placeholder="${T("caption")}" data-p="${p}.images.${gi}.caption" value="${esc(g.caption)}">
      <button class="btn small danger" data-act="delimg" data-i="${i}" data-g="${gi}">${T("del")}</button></div>`).join("")}</div>
      <span class="btn small filebtn">${T("add_images")}<input type="file" multiple accept="image/jpeg,image/png,image/webp,image/gif" data-upgal="${p}.images"></span>`;
  }
  const n = S.data.content.sections.length;
  return `<div class="sec"><div class="sh"><b>${esc(R.SECTION_TYPES[s.type] || s.type)}</b>
    <button class="btn small" data-act="move" data-i="${i}" data-d="-1" ${i === 0 ? "disabled" : ""} aria-label="${T("up")}">↑</button>
    <button class="btn small" data-act="move" data-i="${i}" data-d="1" ${i === n - 1 ? "disabled" : ""} aria-label="${T("down")}">↓</button>
    <button class="btn small danger" data-act="delsec" data-i="${i}">${T("del")}</button></div>${f}</div>`;
}

// ---------- doldurma modu (Paket 2-3) ----------
function drawFill() {
  const fields = S.site.schema?.fields || [];
  const c = S.data.content;
  let html = barHTML() + `<div class="fill">${returnedHTML()}<p class="note">${esc(S.site.schema?.intro || T("fill_intro"))}</p>`;
  if (!fields.length) { root.innerHTML = html + `<p>${T("no_fields")}</p></div>`; bindSend(); return; }
  let group = null;
  for (const f of fields) {
    if (f.group && f.group !== group) { group = f.group; html += `<h2>${esc(group)}</h2>`; }
    const path = `content.${f.key.replace(/\./g, "_")}`;
    const label = `${f.label || f.key}${f.required ? ` <span class="req" title="${T("required")}">*</span>` : ""}`;
    const hint = f.hint ? `<span style="font-size:.8rem">${esc(f.hint)}</span>` : "";
    const max = f.max ? `maxlength="${Number(f.max) * 1.2 | 0}" data-max="${Number(f.max)}"` : "";
    if (f.type === "image") html += imgField(f.label || f.key, path) + hint;
    else if (f.type === "list") html += `<label class="f">${label}${hint}<textarea data-p="${path}" data-list="1" placeholder="${T("list_hint")}">${esc((getP(path) || []).join("\n"))}</textarea></label>`;
    else if (f.type === "textarea") html += `<label class="f">${label}${hint}<textarea data-p="${path}" ${max}>${esc(getP(path) ?? "")}</textarea>${f.max ? `<span class="count" data-for="${path}"></span>` : ""}</label>`;
    else html += `<label class="f">${label}${hint}<input type="${f.type === "url" ? "url" : "text"}" data-p="${path}" value="${esc(getP(path) ?? "")}" ${max}>${f.max ? `<span class="count" data-for="${path}"></span>` : ""}</label>`;
  }
  root.innerHTML = html + `</div>`;
  root.querySelectorAll("[data-max]").forEach(counter);
  bindSend();
}
function counter(el) {
  const c = root.querySelector(`.count[data-for="${el.dataset.p}"]`); if (!c) return;
  const n = el.value.length, m = Number(el.dataset.max);
  c.textContent = `${n} / ${m}`; c.classList.toggle("over", n > m);
}

// ---------- onizleme ----------
let pvT;
function preview(now) {
  clearTimeout(pvT);
  pvT = setTimeout(() => {
    const f = document.getElementById("pv"); if (!f) return;
    let y = 0; try { y = f.contentWindow.scrollY; } catch {}
    f.onload = () => { try { f.contentWindow.scrollTo(0, y); } catch {} };
    f.srcdoc = R.render(S.data.content, S.data.theme, { noindex: true });
  }, now ? 0 : 300);
}

// ---------- kayit ----------
let svT, saving = Promise.resolve();
function markSaved(state) {
  const el = document.getElementById("saved"); if (!el) return;
  el.textContent = T(state); el.classList.toggle("err", state === "save_err");
}
function schedule() { markSaved("saving"); clearTimeout(svT); svT = setTimeout(save, 900); }
function save() {
  clearTimeout(svT);
  saving = saving.then(async () => {
    let error;
    if (S.admin) ({ error } = await sb.from("ms_builds").update({ content: S.data.content, theme: S.data.theme, updated_at: new Date().toISOString() }).eq("id", S.build.id));
    else ({ error } = await sb.rpc("ms_builder_save", { p_key: S.key, p_build: S.build.id, p_content: S.data.content, p_theme: S.data.theme }));
    if (error && /locked/.test(error.message)) { location.reload(); return; }
    markSaved(error ? "save_err" : "saved");
  });
  return saving;
}

// ---------- olaylar ----------
root.addEventListener("input", (e) => {
  const el = e.target; const p = el.dataset.p; if (!p) return;
  let v = el.type === "checkbox" ? el.checked : el.value;
  if (el.dataset.num) v = Number(v);
  if (el.dataset.list) v = el.value.split("\n").map((x) => x.trim()).filter(Boolean);
  if (p.startsWith("theme.colors") || p.startsWith("theme.fonts") || p === "theme.layout" || p === "theme.radius") {
    if (!S.data.theme.colors && p.startsWith("theme.colors")) S.data.theme.colors = { ...R.themeOf(S.data.theme).colors };
  }
  setP(p, v);
  if (el.dataset.max) counter(el);
  schedule(); preview();
});
root.addEventListener("change", async (e) => {
  const el = e.target;
  if (el.dataset.up || el.dataset.upgal) {
    const files = [...el.files]; if (!files.length) return;
    const holder = el.parentElement; const old = holder.firstChild.textContent;
    holder.firstChild.textContent = T("uploading") + "…";
    try {
      for (const file of files) {
        const fd = new FormData(); fd.append("key", S.key); fd.append("file", file);
        const r = await fetch(C.fn, { method: "POST", body: fd, headers: { apikey: C.anon } });
        const j = await r.json();
        if (!r.ok || !j.url) throw new Error(j.error || "upload");
        if (el.dataset.up) setP(el.dataset.up, j.url);
        else { const arr = getP(el.dataset.upgal) || []; arr.push({ url: j.url, alt: "", caption: "" }); setP(el.dataset.upgal, arr); }
      }
      schedule(); draw();
    } catch { holder.firstChild.textContent = old; alert(T("upload_err")); }
  }
});
root.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const c = S.data.content, a = b.dataset.act, i = Number(b.dataset.i), g = Number(b.dataset.g);
  if (a === "view") { S.view = b.dataset.v; draw(); return; }
  if (a === "preset") { S.data.theme = { preset: b.dataset.k }; }
  else if (a === "clear") setP(b.dataset.path, "");
  else if (a === "addsec") {
    const type = document.getElementById("newSec").value;
    const s = { type, title: "" };
    if (type === "menu") s.groups = [{ name: "", items: [{ name: "", price: "", desc: "" }] }];
    if (type === "gallery") s.images = [];
    c.sections.push(s);
  }
  else if (a === "delsec") c.sections.splice(i, 1);
  else if (a === "move") { const j = i + Number(b.dataset.d); [c.sections[i], c.sections[j]] = [c.sections[j], c.sections[i]]; }
  else if (a === "addgroup") (c.sections[i].groups ||= []).push({ name: "", items: [{ name: "", price: "", desc: "" }] });
  else if (a === "delgroup") c.sections[i].groups.splice(g, 1);
  else if (a === "additem") (c.sections[i].groups[g].items ||= []).push({ name: "", price: "", desc: "" });
  else if (a === "delitem") c.sections[i].groups[g].items.splice(Number(b.dataset.it), 1);
  else if (a === "delimg") c.sections[i].images.splice(g, 1);
  else return;
  const open = [...root.querySelectorAll("details.panel")].map((d) => d.open);
  const y = root.querySelector(".editor")?.scrollTop || 0;
  schedule(); draw();
  root.querySelectorAll("details.panel").forEach((d, k) => { if (open[k] != null) d.open = open[k]; });
  const ed = root.querySelector(".editor"); if (ed) ed.scrollTop = y;
});

// ---------- gonderme ----------
function bindSend() {
  const btn = document.getElementById("sendBtn"); if (!btn) return;
  const dlg = document.getElementById("sendDlg");
  btn.onclick = () => dlg.showModal();
}
document.getElementById("sendCancel").onclick = () => document.getElementById("sendDlg").close();
document.getElementById("sendGo").onclick = async (e) => {
  e.target.disabled = true;
  await save();
  const { error } = await sb.rpc("ms_builder_submit", { p_key: S.key, p_build: S.build.id, p_note: document.getElementById("sendNote").value || null });
  e.target.disabled = false;
  if (error) { alert(T("save_err")); return; }
  document.getElementById("sendDlg").close();
  load();
};
const _draw = draw;
draw = function () { _draw(); bindSend(); };
window.addEventListener("beforeunload", (e) => { if (document.getElementById("saved")?.textContent === T("saving")) { e.preventDefault(); e.returnValue = ""; } });

load();
</script>
</body>
</html>
