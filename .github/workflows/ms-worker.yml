name: Mr. Space isci

on:
  repository_dispatch:
    types: [ms-work]
  # Hourly runs are paused until the worker RPC backend is installed (see issue #28).
  workflow_dispatch:

concurrency:
  group: ms-worker
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Talepleri isle
        run: node ms/worker/worker.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
