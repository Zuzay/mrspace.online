name: Deploy Supabase functions
# Deploys edge functions that changed on main. Inactive until the repo secret
# SUPABASE_ACCESS_TOKEN exists (Settings > Secrets and variables > Actions).
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:
    inputs:
      functions:
        description: 'Space-separated function names (empty = all changed in last commit)'
        required: false
concurrency: { group: supabase-deploy, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: tizfdnsjhhepxnqqrzuk
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: Skip when token is missing
        id: gate
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "No SUPABASE_ACCESS_TOKEN secret; skipping."; echo "run=no" >> "$GITHUB_OUTPUT"; else echo "run=yes" >> "$GITHUB_OUTPUT"; fi
      - uses: supabase/setup-cli@v1
        if: steps.gate.outputs.run == 'yes'
        with: { version: latest }
      - name: Deploy
        if: steps.gate.outputs.run == 'yes'
        run: |
          FNS="${{ github.event.inputs.functions }}"
          if [ -z "$FNS" ]; then
            FNS=$(git diff --name-only HEAD~1 HEAD -- supabase/functions | awk -F/ 'NF>3 && $3 !~ /^_/ {print $3}' | sort -u | tr '\n' ' ')
          fi
          for fn in $FNS; do
            [ -f "supabase/functions/$fn/index.ts" ] || continue
            echo "Deploying $fn"; supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt
          done
