name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build public files only
        run: node tools/build-public-site.mjs "$RUNNER_TEMP/mrspace-public"
      - name: Verify deployment boundary
        run: node --test tests/public-surface.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/mrspace-public
      - uses: actions/deploy-pages@v4
