<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Onay · Mr. Space</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef0f2; --paper:#fff; --ink:#1c2430; --mute:#5d6878; --line:#d5dae1; --denim:#2f4a6b; --soft:#dfe6ef;
  --red:#b3412a; --yellow:#a7740c; --green:#2e6b4a; --blue:#3d5f8a;
  --sans:"Familjen Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root{--bg:#141922;--paper:#1d2430;--ink:#e8ecf1;--mute:#9aa5b4;--line:#2e3746;--denim:#8fb0d6;--soft:#26344a;--red:#ec8a72;--yellow:#e3b34f;--green:#7fc39c;--blue:#8fb0d6}}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--denim);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:18px 16px 60px}
header.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
header.top h1{margin:0;font-size:1.5rem}
header.top a{color:var(--mute);text-decoration:none}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;color:var(--mute)}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--red);font-weight:500}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 12px;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--denim)}
.btn.main{background:var(--denim);border-color:var(--denim);color:var(--paper)}
.btn.small{padding:3px 9px;font-size:.86rem}
.btn:disabled{opacity:.45;cursor:default}
.queue{display:grid;gap:8px}
.q{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;cursor:pointer;text-align:left;width:100%}
.q:hover{border-color:var(--denim)}
.q b{font-size:1.02rem}
.q .age{margin-left:auto;font-variant-numeric:tabular-nums}
.age.late{color:var(--yellow);font-weight:700}
.age.over{color:var(--red);font-weight:700}
.pill{border-radius:4px;padding:1px 7px;font-size:.8rem;background:var(--soft)}
.pill.fail{background:color-mix(in srgb,var(--red) 18%,var(--paper));color:var(--red)}
.pill.warn{background:color-mix(in srgb,var(--yellow) 18%,var(--paper));color:var(--yellow)}
.pill.pass{background:color-mix(in srgb,var(--green) 18%,var(--paper));color:var(--green)}
.detail{display:grid;grid-template-columns:1fr 420px;gap:14px;align-items:start}
@media (max-width:980px){.detail{grid-template-columns:1fr}}
.pv{background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow:hidden;height:78vh}
.pv iframe{width:100%;height:100%;border:0;background:#fff}
.side{display:grid;gap:12px}
.box{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px}
.box h2{font-size:1rem;margin:0 0 10px}
.chk{display:grid;grid-template-columns:14px 1fr;gap:4px 10px;padding:8px 0;border-top:1px solid var(--line)}
.chk:first-of-type{border-top:0}
.dot{width:12px;height:12px;border-radius:50%;margin-top:4px}
.dot.fail{background:var(--red)} .dot.warn{background:var(--yellow)} .dot.pass{background:var(--green)} .dot.info{background:var(--blue)}
.chk .dt{grid-column:2;font-size:.82rem;color:var(--mute);overflow-wrap:anywhere}
.chk .dt a{color:inherit}
.manual label{display:flex;gap:8px;align-items:flex-start;padding:4px 0}
textarea,input[type=text],input[type=number],select{border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:var(--bg);width:100%}
textarea{min-height:70px;resize:vertical}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.cnote{background:var(--soft);border-radius:7px;padding:10px;white-space:pre-wrap}
.fields{display:grid;gap:8px;padding:14px;overflow:auto;height:100%}
.fields div{border-bottom:1px solid var(--line);padding-bottom:6px}
.fields small{color:var(--mute);display:block}
.fields img{max-width:160px;border-radius:6px;display:block;margin-top:4px}
.empty{padding:40px 16px;text-align:center;color:var(--mute);background:var(--paper);border:1px dashed var(--line);border-radius:8px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--line);border-radius:8px;font-size:.92rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:500}
.edit{display:grid;gap:8px;background:var(--bg);padding:10px;border-radius:7px}
.login{max-width:340px;margin:12vh auto;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:22px;display:grid;gap:10px}
.err{color:var(--red);font-size:.9rem;min-height:1.2em}
</style>
</head>
<body>
<div id="login" class="login" hidden>
  <h2 style="margin:0">Mr. Space</h2>
  <input id="u" type="text" placeholder="Kullanıcı adı" autocomplete="username" value="mr.space">
  <input id="p" type="password" placeholder="Şifre" autocomplete="current-password" style="border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:var(--bg)">
  <button class="btn main" id="go">Giriş yap</button>
  <div class="err" id="lerr"></div>
</div>

<div id="app" class="wrap" hidden>
  <header class="top"><h1>Onay</h1><a href="../">Panele dön</a></header>
  <nav class="tabs" id="tabs">
    <button data-tab="queue" aria-selected="true">Bekleyenler</button>
    <button data-tab="sites">Siteler</button>
  </nav>
  <main id="view"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../../assets/ms-config.js"></script>
<script src="../../assets/ms-render.js"></script>
<script>
const C = window.MS_CONFIG;
const sb = supabase.createClient(C.url, C.anon);
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = (u) => /^https?:\/\//i.test(u || "") ? u : "#";
const P = new URLSearchParams(location.search);
const STATUS = { draft: "Taslak", checking: "Kontrol ediliyor", review: "Senin onayında", returned: "Müşteriye döndü", published: "Yayında", archived: "Eski sürüm" };
const LEVEL = { fail: "Kırmızı", warn: "Sarı", info: "Bilgi", pass: "Yeşil" };
const MANUAL = [
  "Marka ve isim çakışmasına baktım",
  "Görselleri kırptım, sıraladım, kaynağını kontrol ettim",
  "Renk, yazı ve boşlukları elden geçirdim",
  "Metinleri düzelttim (yazım, ton, uzunluk)",
  "Telefonda baştan sona baktım",
];
let tab = "queue";

// ---------- giris ----------
async function boot() {
  const { data } = await sb.auth.getSession();
  if (!data.session) { $("#login").hidden = false; return; }
  if (P.get("next")) { location.href = P.get("next"); return; }
  $("#login").hidden = true; $("#app").hidden = false;
  if (P.get("b")) openBuild(P.get("b")); else render();
}
$("#go").onclick = async () => {
  let u = $("#u").value.trim(); if (!u.includes("@")) u += "@mrspace.online";
  const { error } = await sb.auth.signInWithPassword({ email: u, password: $("#p").value });
  $("#lerr").textContent = error ? "Kullanıcı adı ya da şifre hatalı." : "";
  if (!error) boot();
};
$("#p").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#go").click(); });

$("#tabs").onclick = (e) => {
  const t = e.target.closest("button[data-tab]"); if (!t) return;
  tab = t.dataset.tab;
  document.querySelectorAll("#tabs button").forEach((x) => x.setAttribute("aria-selected", x === t));
  history.replaceState(null, "", location.pathname);
  render();
};
function render() { tab === "sites" ? renderSites() : renderQueue(); }

// ---------- kuyruk ----------
function ageHTML(at) {
  if (!at) return "";
  const h = (Date.now() - new Date(at)) / 3600e3;
  const cls = h > 48 ? "over" : h > 24 ? "late" : "";
  return `<span class="age ${cls}">${h < 1 ? "az önce" : Math.floor(h) + " saat"}</span>`;
}
function sumHTML(s) {
  if (!s) return "";
  return `${s.fail ? `<span class="pill fail">${s.fail} kırmızı</span>` : ""}${s.warn ? `<span class="pill warn">${s.warn} sarı</span>` : ""}${!s.fail && !s.warn ? `<span class="pill pass">temiz</span>` : ""}`;
}
async function renderQueue() {
  const { data, error } = await sb.from("ms_builds").select("id, site, version, status, submitted_at, updated_at, checks_summary, ms_sites(name, mode)")
    .in("status", ["checking", "review", "returned", "draft"]).order("submitted_at", { ascending: true, nullsFirst: false });
  if (error) { $("#view").innerHTML = `<div class="empty">Okunamadı: ${esc(error.message)}</div>`; return; }
  const waiting = data.filter((b) => ["checking", "review"].includes(b.status));
  const other = data.filter((b) => !["checking", "review"].includes(b.status));
  const row = (b) => `<button class="q" data-open="${b.id}"><b>${esc(b.ms_sites?.name || b.site)}</b><span>v${b.version}</span>
    <span class="pill">${STATUS[b.status]}</span><span class="pill">${b.ms_sites?.mode === "fill" ? "Doldurma" : "Kurucu"}</span>
    ${sumHTML(b.checks_summary)}${["checking", "review"].includes(b.status) ? ageHTML(b.submitted_at) : `<span class="age">${new Date(b.updated_at).toLocaleDateString("tr-TR")}</span>`}</button>`;
  $("#view").innerHTML = `
    <h2 style="font-size:1rem;margin:0 0 8px">Onay bekleyen (${waiting.length})</h2>
    ${waiting.length ? `<div class="queue">${waiting.map(row).join("")}</div>` : `<div class="empty">Bekleyen site yok.</div>`}
    ${other.length ? `<h2 style="font-size:1rem;margin:22px 0 8px">Müşteride ya da taslakta (${other.length})</h2><div class="queue">${other.map(row).join("")}</div>` : ""}`;
}
$("#view").addEventListener("click", (e) => {
  const q = e.target.closest("[data-open]"); if (q) openBuild(q.dataset.open);
});

// ---------- tek surum ----------
async function openBuild(id) {
  history.replaceState(null, "", `?b=${id}`);
  const { data: b, error } = await sb.from("ms_builds").select("*").eq("id", id).single();
  if (error) { $("#view").innerHTML = `<div class="empty">Okunamadı: ${esc(error.message)}</div>`; return; }
  const [{ data: s }, { data: checks }] = await Promise.all([
    sb.from("ms_sites").select("*").eq("slug", b.site).single(),
    sb.from("ms_build_checks").select("*").eq("build_id", id),
  ]);
  const order = { fail: 0, warn: 1, info: 2, pass: 3 };
  (checks || []).sort((a, c) => order[a.level] - order[c.level]);
  const fails = (checks || []).filter((c) => c.level === "fail").length;
  const done = JSON.parse(localStorage.getItem("ms_manual_" + id) || "[]");
  const canAct = ["review", "checking", "draft"].includes(b.status);

  const preview = s.mode === "fill"
    ? `<div class="fields">${(s.field_schema?.fields || []).map((f) => {
        const v = b.content?.[String(f.key).replace(/\./g, "_")];
        const shown = Array.isArray(v) ? v.map(esc).join("<br>") : (f.type === "image" && v ? `<img src="${esc(safeUrl(v))}" alt="">` : esc(v ?? ""));
        return `<div><small>${esc(f.group ? f.group + ": " : "")}${esc(f.label || f.key)}</small>${shown || '<span style="color:var(--red)">boş</span>'}</div>`;
      }).join("") || "Alan şeması yok."}</div>`
    : `<iframe id="pv" title="Önizleme"></iframe>`;

  $("#view").innerHTML = `
    <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px">
      <button class="btn small" id="back">Listeye dön</button>
      <b style="font-size:1.15rem">${esc(s.name)}</b><span>v${b.version}</span><span class="pill">${STATUS[b.status]}</span>${ageHTML(b.submitted_at)}
    </div>
    <div class="detail">
      <div class="pv">${preview}</div>
      <div class="side">
        <div class="box acts">
          ${b.status !== "published" ? `<a class="btn main" href="../../build/?b=${b.id}">Düzenle</a>` : ""}
          ${b.status !== "published" ? `<button class="btn" id="recheck">Tekrar kontrol et</button>` : ""}
          ${b.status === "published" ? `<button class="btn" id="newver">Yeni sürüm aç</button>` : ""}
        </div>
        ${b.client_note ? `<div class="box"><h2>Müşterinin notu</h2><div class="cnote">${esc(b.client_note)}</div></div>` : ""}
        <div class="box"><h2>Kontroller</h2>
          ${b.status === "checking" ? `<p style="color:var(--mute)">Kontroller çalışıyor. Bir dakika sonra yenile.</p>` : ""}
          ${(checks || []).map((c) => `<div class="chk"><span class="dot ${c.level}" title="${LEVEL[c.level]}"></span><span>${esc(c.message)}</span>${detailHTML(c.details)}</div>`).join("") || (b.status === "checking" ? "" : '<p style="color:var(--mute)">Kontrol sonucu yok. "Tekrar kontrol et" ile başlat.</p>')}
        </div>
        ${canAct ? `<div class="box manual"><h2>Senin dokunuşların</h2>
          ${MANUAL.map((m, i) => `<label><input type="checkbox" data-man="${i}" ${done.includes(i) ? "checked" : ""}>${esc(m)}</label>`).join("")}
          <label style="display:grid;gap:4px;margin-top:8px">Harcanan süre (dakika)<input type="number" id="mins" min="0" max="600" value="0"></label>
        </div>
        <div class="box"><h2>Karar</h2>
          ${fails ? `<label style="display:grid;gap:4px;margin-bottom:10px;color:var(--red)">Kırmızı kontrol var. Geçmek için gerekçe yaz:<textarea id="override"></textarea></label>` : ""}
          <div class="acts"><button class="btn main" id="publish">Onayla ve yayınla</button><button class="btn" id="ret">Müşteriye geri gönder</button></div>
          <div id="retBox" hidden style="margin-top:10px"><textarea id="retNote" placeholder="Müşteriye görünecek not: neyi düzeltmesi gerekiyor?"></textarea><button class="btn" id="retGo" style="margin-top:8px">Geri gönder</button></div>
        </div>` : ""}
        <div class="box"><h2>İç not</h2><textarea id="anote" placeholder="Sadece sen görürsün">${esc(b.admin_note || "")}</textarea></div>
      </div>
    </div>`;

  if (s.mode !== "fill") $("#pv").srcdoc = window.MsRender.render(b.content, b.theme, { noindex: true });
  $("#back").onclick = () => { history.replaceState(null, "", location.pathname); renderQueue(); };
  $("#anote").onblur = () => sb.from("ms_builds").update({ admin_note: $("#anote").value }).eq("id", id);
  $("#recheck") && ($("#recheck").onclick = async () => { await sb.rpc("ms_build_recheck", { p_build: Number(id) }); openBuild(id); });
  $("#newver") && ($("#newver").onclick = async () => {
    const { data, error } = await sb.rpc("ms_build_new_version", { p_site: b.site });
    if (error) return alert(error.message);
    location.href = `../../build/?b=${data}`;
  });
  if (!canAct) return;

  const manBoxes = [...document.querySelectorAll("[data-man]")];
  const sync = () => {
    const ticked = manBoxes.filter((x) => x.checked).map((x) => Number(x.dataset.man));
    localStorage.setItem("ms_manual_" + id, JSON.stringify(ticked));
    $("#publish").disabled = ticked.length < MANUAL.length;
    $("#publish").title = $("#publish").disabled ? "Önce dokunuşların hepsini işaretle" : "";
  };
  manBoxes.forEach((x) => x.onchange = sync); sync();

  $("#publish").onclick = async () => {
    const reason = $("#override")?.value || null;
    if (fails && (!reason || reason.trim().length < 5)) return alert("Kırmızı kontrolü geçmek için gerekçe yaz.");
    if (!confirm(`${s.name} yayına alınsın mı?`)) return;
    const { error } = await sb.rpc("ms_build_publish", { p_build: Number(id), p_override_reason: reason, p_minutes: Number($("#mins").value) || 0 });
    if (error) return alert(error.message === "has_fail" ? "Kırmızı kontrol var, gerekçe gerekli." : error.message);
    localStorage.removeItem("ms_manual_" + id);
    openBuild(id);
  };
  $("#ret").onclick = () => { $("#retBox").hidden = false; $("#retNote").focus(); };
  $("#retGo").onclick = async () => {
    const note = $("#retNote").value.trim(); if (note.length < 5) return alert("Müşteriye kısa bir not yaz.");
    const { error } = await sb.rpc("ms_build_return", { p_build: Number(id), p_note: note });
    if (error) return alert(error.message);
    openBuild(id);
  };
}

function detailHTML(d) {
  if (!d || typeof d !== "object") return "";
  const parts = [];
  for (const [k, v] of Object.entries(d)) {
    if (v == null || (Array.isArray(v) && !v.length)) continue;
    const list = Array.isArray(v) ? v : [v];
    parts.push(list.slice(0, 8).map((x) => /^https?:\/\//.test(String(x)) ? `<a href="${esc(safeUrl(String(x).split(" ")[0]))}" target="_blank" rel="noopener">${esc(x)}</a>` : esc(typeof x === "object" ? JSON.stringify(x) : x)).join(", ") + (list.length > 8 ? ` ve ${list.length - 8} tane daha` : ""));
  }
  return parts.length ? `<span class="dt">${parts.join("<br>")}</span>` : "";
}

// ---------- siteler ----------
async function renderSites() {
  const { data: sites, error } = await sb.from("ms_sites").select("*").order("created_at");
  if (error) { $("#view").innerHTML = `<div class="empty">Okunamadı: ${esc(error.message)}</div>`; return; }
  const base = location.origin;
  $("#view").innerHTML = `<p style="color:var(--mute);margin:0 0 12px">Kurucu linkini müşteriye gönder. Paket 2-3 için modu "Doldurma" yap ve alan şemasını gir.</p>
  <div class="table-wrap"><table><thead><tr><th>Site</th><th>Mod</th><th>Ülke</th><th>Alan adı</th><th></th></tr></thead><tbody>
  ${sites.map((s) => `<tr data-slug="${esc(s.slug)}">
    <td><b>${esc(s.name)}</b><br><small style="color:var(--mute)">${esc(s.plan)}, ${esc(s.status)}</small></td>
    <td>${s.mode === "fill" ? "Doldurma" : "Kurucu"}</td><td>${esc(s.country || "")}</td><td>${esc(s.host || "")}</td>
    <td class="acts"><button class="btn small" data-copy="${esc(base)}/build/?k=${esc(s.site_key)}">Kurucu linkini kopyala</button>
      ${s.published_build ? `<a class="btn small" href="${esc(s.host ? "https://" + s.host + "/" : base + "/site/?s=" + encodeURIComponent(s.slug))}" target="_blank" rel="noopener">Yayındaki site</a>` : ""}
      <button class="btn small" data-edit="${esc(s.slug)}">Ayarlar</button></td></tr>
    <tr hidden data-editrow="${esc(s.slug)}"><td colspan="5"><div class="edit">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px">
        <label>Mod<select data-f="mode"><option value="builder" ${s.mode !== "fill" ? "selected" : ""}>Kurucu (Paket 1)</option><option value="fill" ${s.mode === "fill" ? "selected" : ""}>Doldurma (Paket 2-3)</option></select></label>
        <label>Ülke<input type="text" data-f="country" value="${esc(s.country || "")}" placeholder="US, TR, CY"></label>
        <label>Alan adı<input type="text" data-f="host" value="${esc(s.host || "")}" placeholder="ornek.com"></label>
      </div>
      <label>Alan şeması (Doldurma modu, JSON)<textarea data-f="field_schema" style="min-height:160px;font-family:ui-monospace,monospace;font-size:.85rem" placeholder='{"intro":"...","fields":[{"key":"hero_title","label":"Ana başlık","group":"Giriş","type":"text","max":60,"required":true,"hint":"Kısa ve net"}]}'>${esc(s.field_schema ? JSON.stringify(s.field_schema, null, 2) : "")}</textarea></label>
      <small style="color:var(--mute)">Alan türleri: text, textarea, image, url, list</small>
      <div class="acts"><button class="btn main" data-save="${esc(s.slug)}">Kaydet</button><span data-msg="${esc(s.slug)}"></span></div>
    </div></td></tr>`).join("")}
  </tbody></table></div>`;
}
$("#view").addEventListener("click", async (e) => {
  const cp = e.target.closest("[data-copy]");
  if (cp) { await navigator.clipboard.writeText(cp.dataset.copy); cp.textContent = "Kopyalandı"; setTimeout(() => cp.textContent = "Kurucu linkini kopyala", 1500); return; }
  const ed = e.target.closest("[data-edit]");
  if (ed) { const r = document.querySelector(`[data-editrow="${ed.dataset.edit}"]`); r.hidden = !r.hidden; return; }
  const sv = e.target.closest("[data-save]");
  if (sv) {
    const slug = sv.dataset.save, box = document.querySelector(`[data-editrow="${slug}"]`);
    const val = (f) => box.querySelector(`[data-f="${f}"]`).value.trim();
    let schema = null;
    if (val("field_schema")) {
      try { schema = JSON.parse(val("field_schema")); if (!Array.isArray(schema.fields)) throw 0; }
      catch { document.querySelector(`[data-msg="${slug}"]`).textContent = "Şema geçersiz: içinde fields listesi olmalı."; return; }
    }
    const host = val("host").replace(/^https?:\/\//, "").replace(/^www\./, "").replace(/\/.*$/, "").toLowerCase() || null;
    const { error } = await sb.from("ms_sites").update({ mode: val("mode"), country: val("country").toUpperCase() || null, host, field_schema: schema }).eq("slug", slug);
    document.querySelector(`[data-msg="${slug}"]`).textContent = error ? (error.code === "23505" ? "Bu alan adı başka sitede kayıtlı." : error.message) : "Kaydedildi";
    if (!error) setTimeout(renderSites, 800);
  }
});

boot();
</script>
</body>
</html>
